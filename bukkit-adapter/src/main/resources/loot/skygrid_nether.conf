# ==============================================================================
# UXPLIMA Skyblock - A loot table
#
# What a chest in the Nether's SkyGrid holds. modules/skygrid.conf names this
# table under the_nether palette's loot. The way a table is written is told in
# loot/treasure.conf.
# ==============================================================================

rolls = "3-5"

rarities {
    common { weight = 80 }
    rare { weight = 17, effects = "loot-rare" }
    legendary { weight = 3, effects = "loot-legendary" }
}

entries = [
    { weight = 10, amount = "1-3", item { material = NETHER_WART } }
    { weight = 8, amount = "1-2", item { material = CRIMSON_FUNGUS } }
    { weight = 8, amount = "1-2", item { material = WARPED_FUNGUS } }
    { weight = 6, amount = "2-6", item { material = GOLD_NUGGET } }
    { weight = 6, amount = "1-4", item { material = QUARTZ } }
    { weight = 4, amount = "1-3", item { material = GLOWSTONE_DUST } }
    { weight = 4, amount = "1-2", item { material = SOUL_SAND } }
    { weight = 3, item { material = LAVA_BUCKET } }
    { rarity = rare, weight = 4, amount = "1-2", item { material = BLAZE_ROD } }
    { rarity = rare, weight = 3, item { material = GOLDEN_APPLE } }
    { rarity = rare, weight = 3, vanilla = "minecraft:chests/nether_bridge" }
    { rarity = legendary, weight = 2, item { material = ANCIENT_DEBRIS } }
    { rarity = legendary, weight = 1, item { material = NETHERITE_UPGRADE_SMITHING_TEMPLATE } }
]
