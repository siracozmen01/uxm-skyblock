# ==============================================================================
# UXPLIMA Skyblock - A loot table
#
# What a chest in the overworld's SkyGrid holds. modules/skygrid.conf names this
# table under the overworld palette's loot. The way a table is written is told in
# loot/treasure.conf.
# ==============================================================================

rolls = "3-5"

rarities {
    common { weight = 80 }
    rare { weight = 17, effects = "loot-rare" }
    legendary { weight = 3, effects = "loot-legendary" }
}

entries = [
    { weight = 10, amount = "1-2", item { material = OAK_SAPLING } }
    { weight = 8, amount = "2-6", item { material = BONE_MEAL } }
    { weight = 8, amount = "1-4", item { material = WHEAT_SEEDS } }
    { weight = 6, amount = "1-3", item { material = SUGAR_CANE } }
    { weight = 5, amount = "1-2", item { material = CACTUS } }
    { weight = 4, amount = "1-2", item { material = MELON_SEEDS } }
    { weight = 4, amount = "1-2", item { material = PUMPKIN_SEEDS } }
    { weight = 4, amount = "1-2", item { material = ICE } }
    { weight = 3, item { material = WATER_BUCKET } }
    { weight = 2, item { material = LAVA_BUCKET } }
    { weight = 6, amount = "1-4", item { material = BREAD } }
    { weight = 6, amount = "4-12", item { material = TORCH } }
    { weight = 4, amount = "1-3", item { material = IRON_INGOT } }
    { rarity = rare, weight = 4, amount = "1-3", item { material = GOLD_INGOT } }
    { rarity = rare, weight = 3, item { material = SADDLE } }
    { rarity = rare, weight = 3, vanilla = "minecraft:chests/simple_dungeon" }
    { rarity = legendary, weight = 2, amount = "1-2", item { material = DIAMOND } }
    { rarity = legendary, weight = 1, item { material = ENCHANTED_GOLDEN_APPLE } }
]
