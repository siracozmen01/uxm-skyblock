# ==============================================================================
# UXPLIMA Skyblock - A loot table
#
# What the slayer of the deep boss of a Poseidon island is given, besides what
# the creature drops of itself. modules/poseidon.conf names this table under
# boss loot. The way a table is written is told in loot/treasure.conf.
# ==============================================================================

rolls = "3-5"

rarities {
    common { weight = 70 }
    rare { weight = 25, effects = "loot-rare" }
    legendary { weight = 5, effects = "loot-legendary" }
}

entries = [
    { weight = 10, amount = "8-16", item { material = PRISMARINE_SHARD } }
    { weight = 8, amount = "6-12", item { material = PRISMARINE_CRYSTALS } }
    { weight = 6, amount = "2-4", item { material = SEA_LANTERN } }
    { weight = 4, amount = "1-3", item { material = WET_SPONGE } }
    { weight = 3, vanilla = "minecraft:chests/underwater_ruin_big" }
    { rarity = rare, weight = 4, amount = "1-3", item { material = NAUTILUS_SHELL } }
    { rarity = rare, weight = 3, item { material = HEART_OF_THE_SEA } }
    { rarity = rare, weight = 2, item { material = ENCHANTED_BOOK, stored-enchants { depth_strider = 3 } } }
    { rarity = legendary, weight = 2, item { material = TRIDENT } }
    { rarity = legendary, weight = 1, item { material = ENCHANTED_BOOK, stored-enchants { channeling = 1 } } }
]
