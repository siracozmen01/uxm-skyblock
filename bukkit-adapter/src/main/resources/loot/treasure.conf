# ==============================================================================
# UXPLIMA Skyblock - A loot table
#
# Every file in loot/ is a loot table, named by the file: this one is treasure.
# A game mode fills a chest, a barrel or any container from a table by its name,
# the first time a player opens it.
#
# A table is rolled a number of times. Each roll lands on a rarity, by weight,
# then on one of that rarity's entries, by weight. A rarity can name an entry of
# modules/effects.conf, which fires for the player who finds it.
#
# An entry is one of three things:
#   item { ... }        an item, written as in any menu or shop file; amount is
#                       a number or a span like "2-6", and slot puts it in that
#                       slot when the slot is free
#   actions = [ ... ]   action lines, as in modules/effects.conf, run for the
#                       player who finds it
#   vanilla = "..."     one of the server's own loot tables, the game's or a
#                       datapack's, by its key
#
# An entry with no rarity is common, and one with no weight weighs 1.
# ==============================================================================

rolls = "3-5"

rarities {
    common { weight = 80 }
    rare { weight = 18, effects = "loot-rare" }
    legendary { weight = 2, effects = "loot-legendary" }
}

entries = [
    { weight = 10, amount = "4-12", item { material = BREAD } }
    { weight = 8, amount = "2-6", item { material = IRON_INGOT } }
    { weight = 6, amount = "1-3", item { material = GOLD_INGOT } }
    { weight = 4, vanilla = "minecraft:chests/simple_dungeon" }
    { rarity = rare, weight = 5, amount = "1-2", item { material = DIAMOND } }
    { rarity = rare, weight = 2, item { material = ENCHANTED_BOOK, stored-enchants { mending = 1 } } }
    { rarity = legendary, weight = 1, slot = 13, item { material = NETHERITE_SCRAP } }
    { rarity = legendary, weight = 1, actions = ["[message] @loot.treasure_found", "[give-money] 250"] }
]
