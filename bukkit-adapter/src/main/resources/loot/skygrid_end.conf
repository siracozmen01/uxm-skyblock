# ==============================================================================
# UXPLIMA Skyblock - A loot table
#
# What a chest in the End's SkyGrid holds. modules/skygrid.conf names this table
# under the_end palette's loot. The way a table is written is told in
# loot/treasure.conf.
# ==============================================================================

rolls = "3-5"

rarities {
    common { weight = 80 }
    rare { weight = 17, effects = "loot-rare" }
    legendary { weight = 3, effects = "loot-legendary" }
}

entries = [
    { weight = 10, amount = "1-3", item { material = ENDER_PEARL } }
    { weight = 8, amount = "1-2", item { material = CHORUS_FLOWER } }
    { weight = 8, amount = "2-6", item { material = CHORUS_FRUIT } }
    { weight = 6, amount = "1-4", item { material = END_ROD } }
    { weight = 4, amount = "2-8", item { material = OBSIDIAN } }
    { weight = 4, amount = "1-3", item { material = IRON_INGOT } }
    { rarity = rare, weight = 4, amount = "1-2", item { material = SHULKER_SHELL } }
    { rarity = rare, weight = 3, item { material = DRAGON_BREATH } }
    { rarity = rare, weight = 3, vanilla = "minecraft:chests/end_city_treasure" }
    { rarity = legendary, weight = 2, item { material = ELYTRA } }
    { rarity = legendary, weight = 1, item { material = DRAGON_HEAD } }
]
