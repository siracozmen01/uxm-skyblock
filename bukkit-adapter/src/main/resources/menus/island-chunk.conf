# One closed chunk of a ChunkBlock island: its grade, every line of its price, and the buttons that
# pay for it. The chunks window and the sign over a closed chunk open it.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue: tier, x and z at the
# chunk's middle, ring, the island's level and the level the chunk needs as needed, the island's
# chunk points, the points opening it gives, how many of its lines are paid, and what its bypass
# takes.
#
# The list skyblock:chunk-lines holds each line of the chunk's price. Its tiles ask for
# <entry_what>, <entry_paid> of <entry_needed>, <entry_left>, who it comes <entry_from>, <entry_how>
# a click pays it and the <entry_state> it is in, and wear <entry_material>. skyblock:chunk-pay pays
# that one line. skyblock:chunk-pay-all pays every line it can, and skyblock:chunk-bypass opens the
# chunk by its bypass.

title = "@menu.chunk.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
  decor {
    hide-tooltip = true
  }
}

items {

  summary {
    slot = 4
    material = "FILLED_MAP"
    name = " "
    lore = ["tile:4 @menu.chunk.summary where ring paid level points gives"]
    click {
      any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # One tile for each line of the price, wearing what it asks for.
  lines {
    slots = ["19-25", "28-34"]
    list {
      source = "skyblock:chunk-lines"
      template {
        material = "%entry_material%"
        name = " "
        lore = ["tile:level @menu.chunk.line paid left"]
        click {
          any = ["skyblock:chunk-pay", "sound:BLOCK_NOTE_BLOCK_PLING 0.6 1.5"]
        }
      }
    }
  }

  previous {
    slot = 45
    type = previous
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 45
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  pay-all {
    slot = 47
    material = "EMERALD"
    name = " "
    lore = ["tile:good @menu.chunk.pay_all"]
    click {
      any = ["skyblock:chunk-pay-all", "sound:BLOCK_NOTE_BLOCK_PLING 0.6 1.5"]
    }
  }

  back {
    slot = 49
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["skyblock:island:chunks", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  bypass {
    slot = 51
    material = "ENDER_PEARL"
    name = " "
    lore = ["tile:accent @menu.chunk.bypass takes"]
    click {
      any = ["skyblock:chunk-bypass", "sound:ENTITY_ENDERMAN_TELEPORT 0.5 1.2"]
    }
  }

  next {
    slot = 53
    type = next
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 53
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }
}
