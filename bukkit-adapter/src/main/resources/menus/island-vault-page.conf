# One page of the island vault, the chest every member of the island shares.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:vault-open:<page> writes this page and opens the one it
# names. Any verb that leaves the window writes the page as the window holds it.
#
# The page itself is the content region below. Those slots hold real items, so the plugin fills
# them and writes them back, and what the player's island role allows decides what moves. Move
# the region anywhere in the window, but keep as many slots in it as slots-per-page in
# modules/vault.conf. Until the two agree the vault opens in a plain chest.
#
# This menu is given the values page, pages, previous_page, next_page, pages_after (how many
# pages follow this one) and access (what the player's role allows). The value page is spelled
# <argument_page> in the catalogue and %argument_page% here, and so is every other.
# at-least:<value> <n> shows an item only while that value is n or more.

title = "@menu.vault_page.title"
rows = 6
open-actions = ["sound:BLOCK_CHEST_OPEN 0.5 1.0"]

content {
  "skyblock:vault-page" {
    slots = ["0-44"]
    editable = true
  }
}

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  back {
    slot = 45
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["open:island-vault", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  previous {
    slot = 48
    view {
      requirements = ["at-least:page 2"]
    }
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["skyblock:vault-open:%argument_previous_page%", "sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot on the first page, where there is no page before this one.
  first-page {
    slot = 48
    view {
      requirements = ["!at-least:page 2"]
    }
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  page {
    slot = 49
    material = "CHEST"
    name = " "
    lore = ["tile:3 @menu.vault_page.page page pages access"]
    click {
      any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  next {
    slot = 50
    view {
      requirements = ["at-least:pages_after 1"]
    }
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["skyblock:vault-open:%argument_next_page%", "sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot on the last page the island has.
  last-page {
    slot = 50
    view {
      requirements = ["!at-least:pages_after 1"]
    }
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }
}
