# The island menu, the window /is opens.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line:
#
#   name = " "
#   lore = ["tile:money @menu.main.bank balance crystals"]
#
# The word after "tile:" is the colour of the title: a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key after it names a block of the
# catalogue, and every word after the key names one fact of that block, in the order they are
# drawn. Take a word off the line and the tooltip draws one fact fewer.
#
# A catalogue line may carry a live value the menu was opened with. The values this menu is
# given, spelled <argument_<name>> in the catalogue and %argument_<name>% here:
#   island, balance, crystals, exp, member_count, radius, center_x, center_z, size_tier,
#   members_tier, warps_tier, spawner_tier, generator_tier, vault_tier, vault_pages
#
# The verbs this plugin adds are skyblock:teleport-home, skyblock:shop and skyblock:island:<word>.
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>.

title = "@menu.main.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  teleport {
    slot = 11
    material = "ENDER_PEARL"
    name = " "
    lore = ["tile:4 @menu.main.teleport"]
    click {
