# Every OneBlock phase, opened from the phase tile of the OneBlock panel: the phases the island has
# reached, the one it is in and the ones still locked to it. A Bedrock player gets this file as a form.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# The value this menu is given, spelled <argument_phase> in the catalogue, is the phase the island
# is in now.
#
# The list skyblock:oneblock-phase-list holds each phase of the OneBlock files, in their order. Its
# tiles wear the phase's icon as %entry_icon%, and %entry_colour% is good for a phase the island
# reached, accent for the one it is in and muted for one still locked. The words ask for
# <entry_phase>, its title, <entry_key>, its name, <entry_number>, <entry_blocks>, how many breaks
# it lasts, <entry_state>, <entry_wait>, how long it waits before it begins, <entry_requires>, what
# it asks before it begins, and <entry_reward>, what its file's preview says it holds.
# The preview is the tile's description. %entry_facts% names the facts the phase has, so a phase
# that waits for nothing says nothing of it, and one with no preview has no description.
# More phases than slots turn into pages.

title = "@menu.oneblock_phases.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
  decor {
    hide-tooltip = true
  }
}

items {

  # The phase the island is in now.
  summary {
    slot = 4
    material = "CLOCK"
    name = " "
    lore = ["tile:accent @menu.oneblock_phases.summary"]
    click {
      any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # One tile for each phase, in the order of the OneBlock files.
  phases {
    slots = ["10-16", "19-25", "28-34"]
    list {
      source = "skyblock:oneblock-phase-list"
      template {
        material = "%entry_icon%"
        name = " "
        lore = ["tile:%entry_colour% @menu.oneblock_phases.phase %entry_facts%"]
        click {
          any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
        }
      }
    }
  }

  previous {
    slot = 47
    type = previous
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 47
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  back {
    slot = 49
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["skyblock:island:oneblock", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  next-page {
    slot = 51
    type = next
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 51
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }
}
