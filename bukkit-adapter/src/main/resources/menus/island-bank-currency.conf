# One currency of the island bank, the window its tile in the bank window opens.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# Every currency opens this window, the island's own money among them, so each is moved the same way.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue and
# %argument_<name>% here: currency (its id), currency_name, currency_icon, currency_amount (what
# the island holds), currency_carried (what the reader carries), and quick_1 and quick_2, the
# amounts modules/bank.conf names for it under "quick", beside every value of the bank window.
#
# skyblock:bank-move:in <amount> puts this window's currency in the bank and
# skyblock:bank-move:out <amount> takes it out. The amount is a number, %input% for one the player writes, or "all".
# The window is drawn again with what a move left.

title = "@menu.bank_currency.title"
rows = 4
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
  decor {
    hide-tooltip = true
  }
}

items {

  deposit_quick_1 {
    slot = 2
    material = "LIME_DYE"
    name = " "
    lore = ["tile:good @menu.bank_currency.deposit_quick_1"]
    click {
      any = ["skyblock:bank-move:in %argument_quick_1%", "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"]
    }
  }

  deposit_quick_2 {
    slot = 3
    material = "LIME_DYE"
    name = " "
    lore = ["tile:good @menu.bank_currency.deposit_quick_2"]
    click {
      any = ["skyblock:bank-move:in %argument_quick_2%", "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"]
    }
  }

  deposit_custom {
    slot = 5
    material = "HOPPER"
    name = " "
    lore = ["tile:good @menu.bank_currency.deposit_custom"]
    click {
      any = [
        { do = "input:bank.amount", prompt = "@menu.bank.prompt_amount" },
        "skyblock:bank-move:in %input%",
        "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"
      ]
    }
  }

  deposit_all {
    slot = 6
    material = "CHEST"
    name = " "
    lore = ["tile:good @menu.bank_currency.deposit_all"]
    click {
      any = ["skyblock:bank-move:in all", "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"]
    }
  }

  held {
    slot = 13
    material = "%argument_currency_icon%"
    name = " "
    lore = ["tile:money @menu.bank_currency.held held carried"]
    click {
      any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  withdraw_quick_1 {
    slot = 20
    material = "RED_DYE"
    name = " "
    lore = ["tile:bad @menu.bank_currency.withdraw_quick_1"]
    click {
      any = ["skyblock:bank-move:out %argument_quick_1%", "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"]
    }
  }

  withdraw_quick_2 {
    slot = 21
    material = "RED_DYE"
    name = " "
    lore = ["tile:bad @menu.bank_currency.withdraw_quick_2"]
    click {
      any = ["skyblock:bank-move:out %argument_quick_2%", "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"]
    }
  }

  withdraw_custom {
    slot = 23
    material = "DROPPER"
    name = " "
    lore = ["tile:bad @menu.bank_currency.withdraw_custom"]
    click {
      any = [
        { do = "input:bank.amount", prompt = "@menu.bank.prompt_amount" },
        "skyblock:bank-move:out %input%",
        "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"
      ]
    }
  }

  withdraw_all {
    slot = 24
    material = "BARREL"
    name = " "
    lore = ["tile:bad @menu.bank_currency.withdraw_all"]
    click {
      any = ["skyblock:bank-move:out all", "sound:BLOCK_NOTE_BLOCK_BELL 0.5 1.5"]
    }
  }

  back {
    slot = 31
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["skyblock:island:bank", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }
}
