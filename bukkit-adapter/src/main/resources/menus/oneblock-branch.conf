# The ways on from a OneBlock phase that branches: the window the island's block opens at the end of
# such a phase, one tile for each phase it may go on to. A Bedrock player gets this file as a form.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue: phase, the phase
# that ends, and time, how long is left to pick before the first way is taken.

title = "@menu.oneblock_branch.title"
rows = 3
open-actions = ["sound:BLOCK_AMETHYST_BLOCK_CHIME 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
  decor {
    hide-tooltip = true
  }
}

items {

  # The phase that ends, and the time left to pick.
  summary {
    slot = 4
    material = "CLOCK"
    name = " "
    lore = ["tile:warn @menu.oneblock_branch.summary left"]
    click {
      any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # One tile for each way on. The words ask for <entry_phase>, its title, <entry_key>, its name,
  # and <entry_blocks>, how many breaks it lasts. skyblock:oneblock-pick takes it.
  ways {
    slots = ["11-15"]
    list {
      source = "skyblock:oneblock-ways"
      template {
        material = "GRASS_BLOCK"
        name = " "
        lore = ["tile:good @menu.oneblock_branch.way length"]
        click {
          any = ["skyblock:oneblock-pick", "sound:BLOCK_NOTE_BLOCK_PLING 0.6 1.5"]
        }
      }
    }
  }

  close {
    slot = 22
    material = "BARRIER"
    name = "@menu.button.close"
    click {
      any = ["close", "sound:UI_BUTTON_CLICK 0.5 1.0"]
    }
  }
}
