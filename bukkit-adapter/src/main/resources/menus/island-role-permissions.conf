# What one role of the island may do, the window a role on the roles window opens.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:role-permission turns the clicked permission on or off
# for this role. It runs /is permissions under the names this server gave it, so the window and
# the command refuse the same things. The window is drawn again once the change is written.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue and
# %argument_<name>% here: role, the name of the role; role_id, what the commands call it; and
# role_own, yes for a role the owner made and no for one every island has.

title = "@menu.role_permissions.title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The icon of each permission, icon_<permission> for one and icon_default for every permission
# this list does not name.
placeholders {
  icon_block_break = "IRON_PICKAXE"
  icon_block_place = "GRASS_BLOCK"
  icon_bucket_use = "WATER_BUCKET"
  icon_natural_interact = "WHEAT"
  icon_redstone_interact = "REDSTONE"
  icon_chest_open = "CHEST"
  icon_furnace_use = "FURNACE"
  icon_shulker_open = "SHULKER_BOX"
  icon_barrel_open = "BARREL"
  icon_anvil_use = "ANVIL"
  icon_beacon_modify = "BEACON"
  icon_spawner_break = "SPAWNER"
  icon_spawner_change_type = "PIG_SPAWN_EGG"
  icon_spawner_upgrade = "EXPERIENCE_BOTTLE"
  icon_crop_trample_bypass = "FARMLAND"
  icon_animal_breed = "CARROT"
  icon_animal_kill = "IRON_SWORD"
  icon_bank_deposit = "GOLD_INGOT"
  icon_bank_withdraw = "GOLD_NUGGET"
  icon_shop_access = "EMERALD"
  icon_vault_view = "ENDER_EYE"
  icon_vault_deposit = "HOPPER"
  icon_vault_withdraw = "ENDER_CHEST"
  icon_member_invite = "WRITABLE_BOOK"
  icon_member_kick = "BARRIER"
  icon_member_promote = "LIME_DYE"
  icon_member_demote = "RED_DYE"
  icon_settings_modify = "COMPARATOR"
  icon_biome_change = "SPRUCE_SAPLING"
  icon_box_move = "ENDER_PEARL"
  icon_island_fly = "ELYTRA"
  icon_warp_create = "LODESTONE"
  icon_warp_delete = "TNT"
  icon_chat_view = "OAK_SIGN"
  icon_chat_send = "FEATHER"
  icon_default = "PAPER"
}

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  # One tile for each permission. A tile asks for the permission as <entry_permission> and for
  # whether this role has it as <entry_status>. %entry_colour% is good while the role has it and
  # bad while it does not. More permissions than slots turn into pages.
  permissions {
    slots = ["0-35"]
    list {
      source = "skyblock:role-permissions"
      template {
        material = "%entry_material%"
        name = " "
        lore = ["tile:%entry_colour% @menu.role_permissions.permission status"]
        click {
          any = ["skyblock:role-permission", "sound:UI_BUTTON_CLICK 0.5 1.6"]
        }
      }
    }
  }

  previous {
    slot = 39
    type = previous
    view = ["has-previous"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 39
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  back {
    slot = 40
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["skyblock:permissions", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  next {
    slot = 41
    type = next
    view = ["has-next"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 41
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  # Takes this role away, shown only in the window of a role the owner made. Whoever held it
  # is a member again. A shift click, so a slip of the hand takes nothing away.
  delete {
    slot = 44
    view {
      requirements = ["skyblock:role-own-made"]
    }
    material = "LAVA_BUCKET"
    name = " "
    lore = ["tile:bad @menu.role_permissions.delete"]
    click {
      shift-left = ["skyblock:role-delete", "sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
      shift-right = ["skyblock:role-delete", "sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }
}
