# The island border: whether you see it, and the colour it is drawn in. /is border opens it, and so
# does the border tile of the settings window.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# skyblock:border-toggle shows the border to a player who hid it and hides it from one who sees it.
# skyblock:border-colour:<colour> draws it in blue, green or red. The game draws a border in those
# three colours and no other. Both choices are kept on the player, on every island and past a rejoin.

title = "@menu.border.title"
rows = 5
open-actions = ["sound:BLOCK_AMETHYST_BLOCK_CHIME 0.6 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
  decor {
    hide-tooltip = true
  }
}

items {

  toggle {
    slot = 10
    material = "ENDER_EYE"
    name = " "
    lore = ["tile:5 @menu.border.toggle state"]
    click {
      any = ["skyblock:border-toggle", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  blue {
    slot = 12
    material = "LIGHT_BLUE_STAINED_GLASS"
    name = " "
    lore = ["tile:info @menu.border.blue state"]
    click {
      any = ["skyblock:border-colour:blue", "sound:BLOCK_NOTE_BLOCK_CHIME 0.6 1.2"]
    }
  }

  green {
    slot = 14
    material = "LIME_STAINED_GLASS"
    name = " "
    lore = ["tile:good @menu.border.green state"]
    click {
      any = ["skyblock:border-colour:green", "sound:BLOCK_NOTE_BLOCK_CHIME 0.6 1.4"]
    }
  }

  red {
    slot = 16
    material = "RED_STAINED_GLASS"
    name = " "
    lore = ["tile:bad @menu.border.red state"]
    click {
      any = ["skyblock:border-colour:red", "sound:BLOCK_NOTE_BLOCK_CHIME 0.6 1.0"]
    }
  }

  back {
    slot = 40
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["open:island-settings", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # How the island's edge is drawn for everybody who comes, one tile each way: the border, each wall style of
  # modules/walls.conf, and nothing. The words ask for <entry_name> and <entry_state>, and the tile wears
  # <entry_material>. skyblock:edge-choose draws the edge that way, for a role that may change the island's settings.
  # A ChunkBlock island, edged by the wall around its open chunks, shows none.
  edges {
    slots = ["28-34"]
    list {
      source = "skyblock:edge-styles"
      template {
        material = "%entry_material%"
        name = " "
        lore = ["tile:accent @menu.border.edge state"]
        click {
          any = ["skyblock:edge-choose", "sound:BLOCK_NOTE_BLOCK_CHIME 0.6 1.2"]
        }
      }
    }
  }

  previous {
    slot = 36
    type = previous
    view = ["has-previous"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 36
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  next {
    slot = 44
    type = next
    view = ["has-next"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 44
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }
}
