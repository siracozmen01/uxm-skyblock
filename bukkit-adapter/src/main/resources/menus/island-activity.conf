# What happened on your island lately, the window /is activity opens.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# The filters are buttons, and each says what it narrows the feed to:
#
#   skyblock:activity-kind:<name>=<kind>,<kind>   only these kinds of line. The name is the one the
#                                                 window shows, read as menu.activity.kinds.<name>
#                                                 in the language files. skyblock:activity-kind:all
#                                                 shows every kind again.
#   skyblock:activity-since:<time>                only what happened in this stretch of time, such
#                                                 as 24h, 7d or 30d. skyblock:activity-since:all
#                                                 shows all of it again.
#   skyblock:activity-member:next                 only the next member's lines, then the next, and
#                                                 round to everyone. skyblock:activity-member:all
#                                                 shows everyone again.
#   skyblock:activity-open-totals                 the bank by member, under the same filters.
#
# The kinds are MEMBER_JOINED, MEMBER_LEFT, ROLE_CHANGED, TRUST_GRANTED, TRUST_REVOKED,
# BANK_DEPOSIT, BANK_WITHDRAW, UPGRADE_PURCHASED, BOOSTER_ACTIVATED, WARP_CREATED,
# TEMPLATE_APPLIED and MISSION_COMPLETED. Add a button, change what one shows, or take one away.
# Each player keeps the filters they set until they leave the server.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue and
# %argument_<name>% here: count, how many lines it shows; filter_member, filter_kind and
# filter_period, what the feed is narrowed to.

title = "@menu.activity.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  member {
    slot = 0
    material = "NAME_TAG"
    name = " "
    lore = ["tile:4 @menu.activity.member now"]
    click {
      left = ["skyblock:activity-member:next", "sound:UI_BUTTON_CLICK 0.5 1.6"]
      right = ["skyblock:activity-member:all", "sound:UI_BUTTON_CLICK 0.5 1.2"]
    }
  }

  kind-all {
    slot = 2
    material = "BOOK"
    name = " "
    lore = ["tile:4 @menu.activity.kind.all now"]
    click {
      any = ["skyblock:activity-kind:all", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  kind-bank {
    slot = 3
    material = "GOLD_INGOT"
    name = " "
    lore = ["tile:money @menu.activity.kind.bank now"]
    click {
      any = ["skyblock:activity-kind:bank=BANK_DEPOSIT,BANK_WITHDRAW", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  kind-members {
    slot = 4
    material = "PLAYER_HEAD"
    name = " "
    lore = ["tile:4 @menu.activity.kind.members now"]
    click {
      any = [
        "skyblock:activity-kind:members=MEMBER_JOINED,MEMBER_LEFT,ROLE_CHANGED,TRUST_GRANTED,TRUST_REVOKED",
        "sound:UI_BUTTON_CLICK 0.5 1.6"
      ]
    }
  }

  kind-progress {
    slot = 5
    material = "EXPERIENCE_BOTTLE"
    name = " "
    lore = ["tile:level @menu.activity.kind.progress now"]
    click {
      any = [
        "skyblock:activity-kind:progress=UPGRADE_PURCHASED,BOOSTER_ACTIVATED,MISSION_COMPLETED,WARP_CREATED,TEMPLATE_APPLIED",
        "sound:UI_BUTTON_CLICK 0.5 1.6"
      ]
    }
  }

  totals {
    slot = 8
    material = "GOLD_BLOCK"
    name = " "
    lore = ["tile:money @menu.activity.totals_button"]
    click {
      any = ["skyblock:activity-open-totals", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # One tile for each line, the newest first. The words ask for <entry_text>, the line as the
  # feed writes it, and <entry_ago>, how long ago it happened. More lines than slots turn into pages.
  lines {
    slots = ["10-16", "19-25", "28-34"]
    list {
      source = "skyblock:activity"
      template {
        material = "PAPER"
        name = " "
        lore = ["tile:4 @menu.activity.line"]
        click {
          any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
        }
      }
    }
  }

  period-all {
    slot = 37
    material = "CLOCK"
    name = " "
    lore = ["tile:4 @menu.activity.period.all now"]
    click {
      any = ["skyblock:activity-since:all", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  period-day {
    slot = 38
    material = "CLOCK"
    name = " "
    lore = ["tile:4 @menu.activity.period.day now"]
    click {
      any = ["skyblock:activity-since:24h", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  period-week {
    slot = 39
    material = "CLOCK"
    name = " "
    lore = ["tile:4 @menu.activity.period.week now"]
    click {
      any = ["skyblock:activity-since:7d", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  period-month {
    slot = 40
    material = "CLOCK"
    name = " "
    lore = ["tile:4 @menu.activity.period.month now"]
    click {
      any = ["skyblock:activity-since:30d", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  previous {
    slot = 48
    type = previous
    view = ["has-previous"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 48
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  next {
    slot = 50
    type = next
    view = ["has-next"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 50
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  back {
    slot = 49
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["open:island-social", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }
}
