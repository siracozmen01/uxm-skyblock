# What each member put in and took out of the island bank, the window the feed's totals button
# opens. It reads the same lines the feed shows: the member, the kinds and the stretch of time the
# player narrowed the feed to narrow these totals too.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is written as a blank name and one lore line, "tile:<colour> @<key> [fact ...]", as in
# the other menu files. skyblock:activity-open-lines goes back to the feed.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue and
# %argument_<name>% here: count, how many totals it shows; filter_member, filter_kind and
# filter_period, what the feed is narrowed to.

title = "@menu.activity.totals.title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
  decor {
    hide-tooltip = true
  }
}

items {

  filters {
    slot = 4
    material = "HOPPER"
    name = " "
    lore = ["tile:4 @menu.activity.totals.filters member kind period"]
    click {
      any = ["skyblock:activity-open-lines", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # One tile for each member, way and currency, the largest first. The words ask for
  # <entry_player>, <entry_way>, put in or took out, <entry_amount> and <entry_lines>, how many moves
  # it adds up. %entry_material% is a green dye for what went in and a red one for what came out.
  totals {
    slots = ["19-25", "28-34"]
    list {
      source = "skyblock:activity-totals"
      template {
        material = "%entry_material%"
        name = " "
        lore = ["tile:money @menu.activity.totals.total moves"]
        click {
          any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
        }
      }
    }
  }

  previous {
    slot = 39
    type = previous
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 39
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  next {
    slot = 41
    type = next
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 41
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  back {
    slot = 40
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["skyblock:activity-open-lines", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }
}
