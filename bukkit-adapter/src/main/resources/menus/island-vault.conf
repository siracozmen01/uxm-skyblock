# The island vault, the window the vault tile of the island menu opens.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# The value this menu is given, spelled <argument_vault_pages> in the catalogue, is the number of
# pages the island has. at-least:vault_pages <n> shows an item only to an island with n pages or more.

title = "@menu.vault.title"
rows = 4
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  page1 {
    slot = 11
    material = "CHEST"
    name = " "
    lore = ["tile:3 @menu.vault.page1 pages"]
    click {
      any = ["skyblock:island:vault 1", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  page2 {
    slot = 12
    view {
      requirements = ["at-least:vault_pages 2"]
    }
    material = "CHEST"
    name = " "
    lore = ["tile:3 @menu.vault.page2 pages"]
    click {
      any = ["skyblock:island:vault 2", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # Shown in the same slot while the island has fewer than 2 pages.
  page2-locked {
    slot = 12
    view {
      requirements = ["!at-least:vault_pages 2"]
    }
    material = "IRON_BARS"
    name = " "
    lore = ["tile:muted @menu.vault.page2_locked pages"]
    click {
      any = ["open:island-upgrades", "sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  page3 {
    slot = 13
    view {
      requirements = ["at-least:vault_pages 3"]
    }
    material = "CHEST"
    name = " "
    lore = ["tile:3 @menu.vault.page3 pages"]
    click {
      any = ["skyblock:island:vault 3", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # Shown in the same slot while the island has fewer than 3 pages.
  page3-locked {
    slot = 13
    view {
      requirements = ["!at-least:vault_pages 3"]
    }
    material = "IRON_BARS"
    name = " "
    lore = ["tile:muted @menu.vault.page3_locked pages"]
    click {
      any = ["open:island-upgrades", "sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  page4 {
    slot = 14
    view {
      requirements = ["at-least:vault_pages 4"]
    }
    material = "CHEST"
    name = " "
    lore = ["tile:3 @menu.vault.page4 pages"]
    click {
      any = ["skyblock:island:vault 4", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # Shown in the same slot while the island has fewer than 4 pages.
  page4-locked {
    slot = 14
    view {
      requirements = ["!at-least:vault_pages 4"]
    }
    material = "IRON_BARS"
    name = " "
    lore = ["tile:muted @menu.vault.page4_locked pages"]
    click {
      any = ["open:island-upgrades", "sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  more {
    slot = 15
    material = "ENDER_CHEST"
    name = " "
    lore = ["tile:5 @menu.vault.more"]
    click {
      any = ["open:island-upgrades", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  back {
    slot = 31
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["open:island-main", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }
}
