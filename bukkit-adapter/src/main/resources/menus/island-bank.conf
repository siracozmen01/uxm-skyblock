# The island bank, the window the bank tile of the island menu opens.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# A tile is a tooltip in six blocks: a title, the category under it, a description, the facts,
# and the line that says what a click does. It is written as a blank name and one lore line,
# "tile:<colour> @<key> [fact ...]". The colour is a role of theme.conf, a gradient of it, or a
# place on the colour wheel written as a number. The key names a block of the catalogue, and
# every word after it names one fact of that block. Take a word off and the tile draws one fact
# fewer. A button that only moves you around is one line with no lore.
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:island:<branch> runs an island command under the names
# this server gave it, so a server that renamed /is renames it here too.
#
# The values this menu is given, spelled <argument_<name>> in the catalogue: balance, crystals and exp.
# crystals and exp are what missions earn the island. Nobody puts them in or takes them out.
#
# The two rows in the middle are every currency the bank keeps, the island's own money among them,
# as modules/bank.conf lists them, one tile each wearing its icon as %entry_icon%. The words ask for
# <entry_name>, <entry_amount>, what the island holds, and <entry_carried>, what the reader carries.
# skyblock:bank-currency opens island-bank-currency.conf for the one clicked, where it is moved.

title = "@menu.bank.title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The pane behind every free slot. A filler plays no sound, says nothing and shows no tooltip.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  summary {
    slot = 3
    material = "GOLD_BLOCK"
    name = " "
    lore = ["tile:money @menu.bank.summary"]
    click {
      any = ["message:@menu.bank.shared_note", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  island_pool {
    slot = 5
    material = "AMETHYST_CLUSTER"
    name = " "
    lore = ["tile:5 @menu.bank.island_pool crystals exp"]
    click {
      any = ["message:@menu.bank.island_pool_note", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  currencies {
    slots = ["10-16", "19-25"]
    list {
      source = "skyblock:bank-currencies"
      template {
        material = "%entry_icon%"
        name = " "
        lore = ["tile:money @menu.bank.currency held carried"]
        click {
          any = ["skyblock:bank-currency", "sound:UI_BUTTON_CLICK 0.5 1.6"]
        }
      }
    }
  }

  previous {
    slot = 36
    type = previous
    view = ["has-previous"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.previous"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  upkeep {
    slot = 38
    material = "CLOCK"
    name = " "
    lore = ["tile:warn @menu.bank.upkeep"]
    click {
      any = ["skyblock:island:bank upkeep", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  back {
    slot = 40
    material = "FEATHER"
    name = "@menu.button.back"
    click {
      any = ["open:island-main", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  activity {
    slot = 42
    material = "WRITABLE_BOOK"
    name = " "
    lore = ["tile:event @menu.bank.activity"]
    click {
      any = ["skyblock:island:activity", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  # Shown in the same slot when there is no page before this one, so the row keeps its shape.
  no-previous {
    slot = 36
    material = "ARROW"
    name = "@menu.button.no_previous"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  next {
    slot = 44
    type = next
    view = ["has-next"]
    priority = 1
    material = "ARROW"
    name = "@menu.button.next"
    click {
      any = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.0"]
    }
  }

  # Shown in the same slot when there is no page after this one, so the row keeps its shape.
  no-next {
    slot = 44
    material = "ARROW"
    name = "@menu.button.no_next"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }
}
