# The window two players trade in, one each, opened when one answers the other's /is trade.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# view         requirements an item needs before it is drawn at all
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>. skyblock:trade-agree turns the player's agreement on or off, and
# skyblock:trade-cancel calls the trade off. Closing the window calls it off too.
#
# The requirements skyblock:trade-agreed and skyblock:trade-they-agreed hold while this player and
# the other player agree. Written with a leading ! they hold while that player does not.
#
# The two offers are the content regions below. Nothing in this window moves an item: a player
# offers a stack by clicking it in their own inventory, and takes it back by clicking it in their
# half. The stack stays in their inventory until both agree and the trade happens. Move the two
# regions anywhere in the window, but keep twenty slots in each, as many as a player may offer,
# and leave them not editable. Until both are so the trade opens in the window built in code.
#
# The value this menu is given, spelled <argument_player> in the catalogue and %argument_player%
# here, is the name of the other player.

title = "@trade.window.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

content {
  "skyblock:trade-mine" {
    slots = ["9-12", "18-21", "27-30", "36-39", "45-48"]
    editable = false
  }
  "skyblock:trade-theirs" {
    slots = ["14-17", "23-26", "32-35", "41-44", "50-53"]
    editable = false
  }
}

# The pane behind every free slot: the column between the two offers and the gaps in the top row.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}

items {

  # The player's own agreement, in its two states. Any change to either offer takes both back.
  agree {
    slot = 0
    view {
      requirements = ["!skyblock:trade-agreed"]
    }
    material = "RED_CONCRETE"
    name = "@trade.window.waiting"
    click {
      any = ["skyblock:trade-agree", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  agreed {
    slot = 0
    view {
      requirements = ["skyblock:trade-agreed"]
    }
    material = "LIME_CONCRETE"
    name = "@trade.window.ready"
    click {
      any = ["skyblock:trade-agree", "sound:UI_BUTTON_CLICK 0.5 1.2"]
    }
  }

  cancel {
    slot = 4
    material = "BARRIER"
    name = "@trade.window.cancel"
    click {
      any = ["skyblock:trade-cancel", "sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  # Whether the other player agrees, in its two states.
  they-wait {
    slot = 8
    view {
      requirements = ["!skyblock:trade-they-agreed"]
    }
    material = "RED_STAINED_GLASS_PANE"
    name = "@trade.window.other_waiting"
    click {
      any = ["sound:BLOCK_NOTE_BLOCK_BASS 0.6 0.9"]
    }
  }

  they-agree {
    slot = 8
    view {
      requirements = ["skyblock:trade-they-agreed"]
    }
    material = "LIME_STAINED_GLASS_PANE"
    name = "@trade.window.other_ready"
    click {
      any = ["sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }
}
