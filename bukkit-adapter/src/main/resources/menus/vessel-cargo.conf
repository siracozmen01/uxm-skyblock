# The cargo hold of a TradeWinds vessel, opened with /is cargo by anyone of its team aboard it.
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from here, never
# decided in code. Change a slot, restart, and the slot has moved.
#
# title        a key of the message catalogue, written with a leading @, or your own words
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# click        what a click does. "any" answers every click, "left" and "right" one each
#
# The verbs every plugin has are close, open:<menu>, command:<line>, message:<line> and
# sound:<name> <volume> <pitch>.
#
# The hold is the content region below. The hold belongs to the vessel and lives on the server's
# storage, so nothing moves in this window by hand: a click on a stack of the hold takes it into
# the player's inventory, and a click on a stack of their own inventory stows it in the hold. Each
# is carried out on its own and every window of the hold shows it.
#
# The region shows the hold from its first slot, as many slots as the vessel's rank gives it
# (hold-rows in modules/tradewinds.conf). Slots past them stay empty. Keep the region at least as
# large as the largest hold and not editable. A hold it cannot show opens in a plain chest. The
# largest hold of the shipped ranks fills the whole window, so the region takes every slot; with
# smaller holds there is room for buttons of your own.
#
# The value this menu is given, spelled <argument_vessel_rank> in the catalogue, is the name of
# the vessel's rank.

title = "@tradewinds.hold.title"
rows = 6
open-actions = ["sound:BLOCK_BARREL_OPEN 0.6 1.0"]

content {
  "tradewinds:hold" {
    slots = ["0-53"]
    editable = false
  }
}

# The pane behind every slot the region does not take. The shipped region takes them all.
fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  decor {
    hide-tooltip = true
  }
}
