# The OneBlock phase "plains". Its name is this file's name, and the key its title is read by in the
# language files, under oneblock.phases. modules/oneblock.conf lists the phases in the order an island
# goes through them.
#
# A block or creature name is the server's own, such as "IRON_ORE" or "cow". A name the server does
# not know is left out with a warning in the console.

# What the phases menu shows for this phase: any item the server knows.
icon = "GRASS_BLOCK"

# How many breaks this phase lasts.
length = 400

# What the block turns into. A weight of 4 comes up four times as often as a weight of 1.
#
# A block may carry its states, written in quotes: "oak_stairs[facing=north]" = 2. An entry written
# as an object places a spawner of a chosen creature:
#   keeper { weight = 1, block = "SPAWNER", spawns = "zombie" }
blocks {
    GRASS_BLOCK = 20
    DIRT = 12
    OAK_LOG = 8
    BIRCH_LOG = 4
    MELON = 1
    PUMPKIN = 1
}

# How likely one break is to bring a creature onto the block, from 0 to 1.
#
# A creature written as an object comes with a name over its head, MiniMessage or a @key of the
# language files read in the breaker's language, a size against its usual one from 0.0625 to 16, and
# what it wears and holds, by slot: head, chest, legs, feet, hand and off-hand. What it wears never
# drops.
#   keeper { weight = 1, type = "zombie", name = "<red>Keeper", scale = 1.5,
#            equipment { head = "IRON_HELMET", hand = "IRON_SWORD" } }
creature-chance = 0.05
creatures {
    cow = 3
    sheep = 3
    chicken = 2
    pig = 2
}
