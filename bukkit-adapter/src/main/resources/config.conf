# ==============================================================================
# UXPLIMA Skyblock Production Configuration (HOCON)
# Enterprise-grade, distributed, event-driven Skyblock platform
# ==============================================================================
#
# Each start adds to this file, and to every file under modules/, the keys a new release brought.
# No value you wrote is changed. The file as it was is kept beside it as config.conf.bak.
# A key you deleted stays deleted: what each release shipped is kept under .defaults/, and only a
# key that is new since then is added. The file is written again from its contents, so your own
# alignment inside a block can move. To turn something off, use its switch rather than deleting it.

# Server Cluster Node Identity
# Each server instance participating in a multi-node cluster must have a unique ID.
server-node {
    # Unique identifier of this server node. Used for authority leasing,
    # session fencing, outbox dispatching, and audit logging.
    id = "skyblock-node-default"

    # The world the islands live in on this node. It should be an empty world made by this
    # plugin's generator, which bukkit.yml gives it:
    #
    #   worlds:
    #     world:
    #       generator: uxmSkyblock
    #
    # Write that before the world is first made. A world that already has terrain keeps it.
    # Folia makes no world while it runs, so on Folia the island world is the default world.
    # The plugin says at startup when the island world is missing or is generated terrain.
    world-name = "world"

    # Whether this node is one of several sharing a database and a Redis instance.
    # A single server leaves this false and never needs redis-uri.
    clustered = false

    # Where the cluster's Redis lives. Required when clustered is true, ignored otherwise.
    redis-uri = ""

    # How long this node's authority over an island lasts before it must be pushed forward.
    # It is also how long an island waits before another node may pick it up after this one stops.
    # A shorter lease recovers faster from a crash and asks the database for more.
    authority-lease = "10m"

    # How often the lease is pushed forward. It must be shorter than authority-lease, and well
    # inside it, so one missed beat does not cost the node its islands.
    authority-heartbeat-interval = "2m"

    # How long a route to another node stays cached. It bounds how long a visitor can be sent to a
    # node that has since lost authority over the island they asked for. Only read when clustered.
    route-cache-ttl = "15s"

    # Where a visitor is sent when the node that held an island has stopped beating. The live nodes
    # serving the island's world are offered to a strategy, which recommends one. The recommendation
    # takes nothing: the node the visitor lands on takes the island through its lease.
    placement {
        # round-robin, least-loaded, mspt-aware or capacity-weighted. Another plugin may add its own.
        strategy = "least-loaded"

        # How many islands this node holds before it counts as full.
        capacity = 1000

        # The tick time, in milliseconds, above which mspt-aware avoids a node while another is under it.
        # Folia keeps a tick time per region and none for the whole server, so a Folia node reports 0
        # and mspt-aware cannot tell Folia nodes apart. Use least-loaded or capacity-weighted there.
        mspt-ceiling = 45.0
    }
}

# Language
# The number of languages this plugin has is the number of files in messages/.
# Nothing in the code counts them: drop in messages_de.conf and German is offered.
language {
    # The language every message falls back to when a player's own is not shipped.
    # A file messages/messages_<tag>.conf must exist for this tag.
    default = "en"

    # true  = a player reads the language their own client is set to, when we ship it.
    # false = every player reads the default above, whatever their client says.
    follow-client = true
}

# Player State & Inventory Persistence
# Controls how player inventories and profile states are saved and synchronized.
player-state {
    # Durability mode for player profile state.
    # Supported values: "HYBRID" (combines write-ahead logs with periodic checkpoints).
    durability-mode = "HYBRID"

    # Ambient periodic checkpoint interval for online players.
    # Examples: "30s", "60s", "2m", "5m"
    ambient-checkpoint-interval = "60s"
}

# Durable Offline Notifications
# What happened to your island while you were away is kept, and read to you on your next join,
# in your own language. Nothing here is a sentence: the plugin stores which message to show and
# the names it fills in, so rewriting messages/messages_<tag>.conf rewrites old notices too.
notifications {
    # How long a notification a player has already read is kept before it is deleted.
    # Set it to 0 to delete a notice the moment it has been read.
    read-retention = "7d"

    # How often the notifications already read are swept out. The island activity feed is swept
    # on the same pass.
    sweep-interval = "6h"

    # How long a line stays in an island's activity feed. The feed is a digest of what happened
    # lately, not a ledger, so it is kept longer than a notice somebody has read and not forever.
    activity-retention = "30d"

    # How long a settled recovery record is kept. A write-ahead inventory journal and an economy
    # saga exist so a crash in the middle of something can be finished or undone; once one has
    # committed or been undone it has nothing left to recover. A journal a crash left unreconciled
    # is never deleted, and neither is a saga that failed.
    recovery-retention = "7d"
}

# Database Persistence Configuration
# Controls database storage backend, connection pooling, and credentials.
database {
    # Storage type: "sqlite" for single-server local storage,
    # or "remote" for multi-server distributed cluster (MariaDB, PostgreSQL, MySQL).
    type = "sqlite"

    # Remote database connection settings (used when type = "remote").
    # Can also be overridden via environment variables:
    #   SKYBLOCK_JDBC_URL, SKYBLOCK_DB_USER, SKYBLOCK_DB_PASSWORD
    jdbc-url = ""
    username = ""
    password = ""

    # Maximum HikariCP database connection pool size.
    max-pool-size = 10

    # How long a statement on MariaDB, MySQL or PostgreSQL waits for a row another connection holds.
    # A node that dies holding one keeps it until the database notices, and everything behind it
    # waited: fifty seconds on MariaDB, for ever on PostgreSQL. Past this the statement fails and is
    # tried again later; it never goes round the lock. MariaDB and MySQL count whole seconds.
    lock-timeout = "1s"

    # PostgreSQL only: how long a transaction may stay open with nothing happening in it before the
    # server ends it and gives its locks back.
    idle-transaction-timeout = "5s"

    # What startup does when the database would lose a commit if the machine lost power:
    # SQLite below synchronous FULL, MariaDB or MySQL with innodb_flush_log_at_trx_commit
    # other than 1 (or sync_binlog other than 1 with the binary log on), PostgreSQL with
    # fsync or synchronous_commit off.
    #   "DEVELOPMENT"        warns in the console and starts.
    #   "PRODUCTION_STRICT"  refuses to start.
    durability-profile = "DEVELOPMENT"
}

# Roles an island's owner makes beside owner, co-owner, moderator and member.
# The owner types /is permissions create <name>, or presses the button in the roles window,
# and edits the new role there like any other. Taking one away makes whoever held it a member.
roles {
    custom {
        # How many roles of their own every owner may make, and the ceiling no permission can pass.
        base = 3
        max = 10

        # Permission nodes that raise the allowance, written by you. The plugin names no rank:
        # it reads the number off whichever of these nodes the owner holds, and the highest wins.
        # Example:
        #   permission-tiers {
        #     "uxmskyblock.roles.5" = 5
        #   }
        permission-tiers {
        }
    }
}

# Named island homes
# A player sets a home with /is sethome <name> and travels to it with /is home <name>.
homes {
    enabled = true

    # What every player gets, and the ceiling no permission can pass.
    base = 1
    max = 10

    # Permission nodes that raise the allowance, written by you. The plugin names no rank:
    # it reads the number off whichever of these nodes the player holds, and the highest wins.
    # Example:
    #   permission-tiers {
    #     "uxmskyblock.homes.3" = 3
    #     "uxmskyblock.homes.5" = 5
    #   }
    permission-tiers {
    }

    # Where a home may be set, by dimension id: overworld, the_nether, the_end, or
    # one a server adds. A dimension not named here takes no home.
    #   allowed         whether a home may be set there at all
    #   on-island-only  whether it must stand within the player's own island
    #   permission      a node the player must hold, or "" for none
    dimensions {
        overworld { allowed = true, on-island-only = true, permission = "" }
        the_nether { allowed = true, on-island-only = true, permission = "" }
        the_end { allowed = true, on-island-only = true, permission = "" }
    }

    # Game modes whose islands keep no named homes, such as ["oneblock"].
    disabled-in-modes = []
}

# Embedded REST API
# A read mostly HTTP surface for web leaderboards, Discord bots and a web store deposit.
# It ships off on purpose: an HTTP port that opens itself, with a token that is identical on every
# copy of this plugin, is a hole rather than a feature.
rest {
    # Turn the API on. It still refuses to start while bearer-token is the shipped value below.
    enabled = false

    # The address to bind. Leave it on loopback unless a reverse proxy is in front of it.
    host = "127.0.0.1"
    port = 8080

    # The token every request must carry as "Authorization: Bearer <token>".
    # Change this. A node that is enabled while this still reads change-me does not open the port.
    bearer-token = "change-me"

    # How long a deposit's Idempotency-Key is remembered, so a retry of a deposit already
    # made is answered rather than made again. Long enough for any retry a web store makes.
    idempotency-retention = "24h"

    # The most keys held at once, whatever the clock says. The key comes from the caller,
    # so this is the ceiling on what a caller holding the token can make a node remember.
    idempotency-capacity = 10000
}

# Where islands stand in the world
grid {
    # How many blocks apart the centres of two neighbouring islands are, on both axes. Islands are laid
    # out on a square spiral from 0,0. Keep it above twice the largest radius an upgrade can reach.
    # The default puts every island in regions of its own on Folia.
    #
    # This can only change while no island stands away from the centre. Once one does, the spacing
    # those islands stand on is kept, and the start says so, because a new island at another spacing
    # would land inside an old one.
    spacing = 5120

    # How many blocks past everything an island wrote it is cleared when it is deleted, reset or
    # recycled: its border, the grid, sea or cave its game mode laid past it, and its other worlds.
    # The margin catches water, lava and trees that reached over the edge.
    clear-margin = 16
}

# Object Storage Configuration (Local Filesystem, S3/R2 Remote, or both mirrored)
storage {
    # Storage type: "local" (default), "s3", or "mirrored".
    # "mirrored" writes every backup to the local folder and to the s3 bucket below. A backup counts as
    # available only once both hold it, and a restore reads from whichever still has it.
    type = "local"

    # Local backup folder (relative to plugin data directory)
    local-path = "backups"

    # How long a backup waits for every region to hand its chunks over. A backup that waits longer is
    # given up whole and nothing of it is written.
    capture-timeout = "30s"

    # Remote S3 settings (when type = "s3")
    s3 {
        endpoint = "https://s3.amazonaws.com"
        region = "us-east-1"
        bucket = "uxmskyblock-backups"
        access-key = ""
        secret-key = ""
        addressing-mode = "PATH"
        provider-target = "GENERIC_S3"
    }
}

