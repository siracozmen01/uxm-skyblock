# ==============================================================================
# UXPLIMA Skyblock - Public Island Warps & Safe Teleport Configuration (WAR-001)
# ==============================================================================

warps {
    # Whether the island warps subsystem is enabled.
    enabled = true

    # Default base warps allowed per island before upgrades.
    base-warp-limit = 2

    # Safe teleport anti-trap search radius (in blocks) around target coordinate.
    search-radius = 5

    # Teleport warmup delay in seconds (0 to disable warmup for instant teleport).
    warmup-seconds = 3

    # Whether movement during warmup cancels the teleport.
    cancel-on-move = true

    # Cooldown between teleport requests in seconds.
    cooldown-seconds = 5

    # A sign whose first line is the header and whose second is a name makes
    # a warp of that name where it stands, as /is setwarp does, with the same
    # role permission and the same limit. Breaking the sign deletes the warp.
    sign {
        enabled = true
        # Read in any case. Not [warp]: Essentials and its kind read that as a
        # server warp sign, and would take the sign for theirs.
        header = "[islandwarp]"
    }
}
