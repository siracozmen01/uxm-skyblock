# CaveBlock: an island enclosed in rock. Players arrive in a room carved out of it, with tunnels
# winding away and ravines cut deep through it, and mine outward through rock and ores. The rock is
# closed in by a shell below, above and on every side.

# Whether islands can be made as CaveBlock islands.
enabled = true

# The block the rock is closed in by.
shell = "BEDROCK"

# How far the rock reaches from the block players arrive standing on. Keep the radius inside half the
# grid spacing, so two islands' rock never meets.
size {
    radius = 32
    below = 24
    above = 16
}

# The room players arrive in.
room {
    radius = 4
}

# Tunnels that wind out of the room.
tunnels {
    count = 6
    length = 40
}

# Ravines cut deep through the rock.
ravines {
    count = 2
    length = 30
    depth = 14
}

# The rock of each dimension, by dimension id. A dimension not named here uses the overworld's rock.
# Each ore is written BLOCK:chance, the chance that one block of the rock is that ore. The chances of
# one rock add up to at most 1. deep-rock and deep-ores take over deep-below blocks under the arrival.
palettes {
    overworld {
        rock = "STONE"
        ores = [
            "COAL_ORE:0.014",
            "IRON_ORE:0.009",
            "COPPER_ORE:0.008",
            "GOLD_ORE:0.002",
            "REDSTONE_ORE:0.004",
            "LAPIS_ORE:0.002",
            "EMERALD_ORE:0.0004"
        ]
        deep-rock = "DEEPSLATE"
        deep-below = 12
        deep-ores = [
            "DEEPSLATE_IRON_ORE:0.008",
            "DEEPSLATE_GOLD_ORE:0.004",
            "DEEPSLATE_REDSTONE_ORE:0.006",
            "DEEPSLATE_LAPIS_ORE:0.003",
            "DEEPSLATE_DIAMOND_ORE:0.0015"
        ]
    }
    the_nether {
        rock = "NETHERRACK"
        ores = ["NETHER_QUARTZ_ORE:0.016", "NETHER_GOLD_ORE:0.008", "ANCIENT_DEBRIS:0.0004"]
    }
    the_end {
        rock = "END_STONE"
        ores = []
    }
}

# Structures the rock holds, laid after it around the island: count of each kind, spread evenly at
# distance from the centre, its floor depth blocks under where players arrive. A template is one of the
# server's own or a datapack's, or schematic:<name> for the file schematics/<name>.schem under the
# plugin's folder: the plugin writes the four shipped ones on its first start, and you may edit them
# with any tool that writes a Sponge schematic, or with /is schematic save. Inside a schematic, cave air
# is the hollow it carves out of the rock; air leaves the rock as it stands. Each chest and barrel gets
# a loot table from loot, in turn, and each spawner and trial spawner the creature spawner names. A kind
# that would not fit inside the shell is not laid. A shipped kind left out of this file stays as shipped;
# give it count = 0 to stop it.
structures {
    dungeon {
        templates = ["schematic:cave_dungeon"]
        count = 1
        distance = 16
        depth = 10
        loot = ["minecraft:chests/simple_dungeon"]
        spawner = "zombie"
    }
    mineshaft {
        templates = ["schematic:cave_mineshaft"]
        count = 2
        distance = 18
        depth = 3
        loot = ["minecraft:chests/abandoned_mineshaft"]
        spawner = ""
    }
    geode {
        templates = ["schematic:cave_geode"]
        count = 1
        distance = 20
        depth = 16
        loot = []
        spawner = ""
    }
    trial_chamber {
        templates = ["schematic:cave_trial_chamber"]
        count = 1
        distance = 18
        depth = 20
        loot = ["minecraft:chests/trial_chambers/reward"]
        spawner = "breeze"
    }
}
