# Flight on a player's own island, by /is fly.
#
# A player flies where they stand on an island they belong to, when their island role holds the
# fly permission (the owner always does), they hold the permission node below and the island holds
# the upgrade below. Leaving that ground sets them down. Flight a player has from elsewhere, from
# creative or another plugin, is left alone.
fly {
    enabled = true
    # An upgrade of modules/upgrades.conf the island must hold a tier of before its members fly.
    # Leave it empty and the role and the node are the only questions.
    required-upgrade = ""
    # The permission node a player must hold as well. Leave it empty and nobody is asked for one.
    permission = "uxmskyblock.island.fly"
    # Spare the fall of a player who was set down for leaving the island.
    spare-fall = true
}
