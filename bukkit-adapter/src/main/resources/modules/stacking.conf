# Block stacking
#
# A block of a kind listed here, placed on a block of the same kind, joins it:
# the block stays one block in the world and stands for one more. Each block in
# a stack counts toward the island's worth and level, a line above it shows how
# many it stands for, and breaking it gives back one at a time. A player who
# sneaks places a block the usual way.
stacking {
    enabled = true

    # The blocks that stack, by their names
    blocks = [
        "IRON_BLOCK"
        "GOLD_BLOCK"
        "DIAMOND_BLOCK"
        "EMERALD_BLOCK"
        "NETHERITE_BLOCK"
        "LAPIS_BLOCK"
        "REDSTONE_BLOCK"
        "COAL_BLOCK"
        "COPPER_BLOCK"
        "AMETHYST_BLOCK"
    ]

    # The most blocks one stack stands for
    most = 100000
}
