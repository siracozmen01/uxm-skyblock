# OneBlock: an island that starts as one block. Break it and it comes back as something else, drawn
# from the phase the island has reached. Each phase lasts a number of breaks, counted over the whole
# life of the island.
#
# Each phase is a file of its own, oneblock/phases/<name>.conf: its icon, its length, the blocks it
# draws and the creatures that may appear. The list below names the phases, and an island goes
# through them in the order they are written. A phase's name is also the key its title is read by in
# the language files, under oneblock.phases.
#
# A file from before the phases had files of their own, with each phase written inside the list, is
# moved into the files on the first start, and kept beside itself as oneblock.conf.bak.

# Whether islands can be made as OneBlock islands.
enabled = true

# What an island does after its last phase: "stay" keeps it in the last phase, "repeat" starts again
# from the first.
after-last-phase = "repeat"

# How often the breaks counted in memory are added to each island's stored count. A crash loses at
# most this much progress; nothing but the phase depends on the count.
save-interval = "30s"

# How long an island at the end of a phase that branches has to pick the way on, in
# menus/oneblock-branch.conf, before the first way is taken at its next break. A phase branches when
# its file names the phases that may follow it, as next = ["snow", "ocean"].
choose-within = "60s"

# How many breaks before a hostile creature comes its island is told, the breaker in chat and with
# oneblock-creature-coming in modules/effects.conf. The blocks and creatures are drawn that many
# breaks ahead. 0 tells nothing.
creature-warning = 5

phases = ["plains", "underground", "snow", "ocean", "jungle", "nether", "end"]
