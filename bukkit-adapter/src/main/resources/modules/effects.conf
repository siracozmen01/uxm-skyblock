# ==============================================================================
# UXPLIMA Skyblock - What every interaction fires
#
# An interaction is a name here and a list of action lines under it. They happen
# in the order they are written. An interaction this file does not name fires
# nothing, and so does one written as an empty list: the first is a server that
# never asked for it, the second is one that turned it off, and both are quiet.
#
# The lines are the family's own grammar, read by the library's action engine,
# so a line copied out of any other plugin's file means here what it means
# there:
#
#   [message] <MiniMessage line>
#   [title] <line>
#   [subtitle] <line>
#   [actionbar] <line>
#   [bossbar] <line> <colour> <seconds>
#   [sound] <sound key> <volume> <pitch>
#   [particle] <name> <count> <spread>
#   [effect] <potion> <seconds> <level>
#   [broadcast] <MiniMessage line>      said to everybody on the server
#   [console] <command>                 run by the console, without the slash
#   [player] <command>                  run by the player, without the slash
#   [take-money] <amount>               charged through the economy plugin
#   [give-money] <amount>               paid through the economy plugin
#   [take-item] <item> <amount>         taken from the player's inventory
#   [close]                             closes the window the player has open
#
# A price that cannot be paid stops the whole list before anything in it runs.
#
# Any line may carry options in braces straight after the verb. Separate them
# with commas. Every one of them is optional:
#
#   delay=<ticks>          wait before the line runs
#   repeat=<times>         run it more than once
#   every=<ticks>          the wait between repeats
#   chance=<0 to 1>        run it only this often
#   if=<condition>         run it only when the condition holds; a
#                          %placeholder% is read through PlaceholderAPI, and
#                          a skill level through mcMMO, when either is there
#
# For example:
#
#   [message] {delay=40} <green>Two seconds later.
#   [sound] {repeat=3, every=5} ui.button.click 1.0 1.0
#   [console] {chance=0.25, delay=20} say %player_name% got lucky
#   [message] {if=%player_level% >= 10} <gold>A veteran made it.
#
# Some interactions say what happened in placeholders of their own, listed
# above each one, such as %phase% or %time%. They are read in every line
# before any other placeholder is, and so is %player_name%, the player's name,
# with or without PlaceholderAPI.
#
# A line this engine cannot read is logged and skipped. The rest of the list
# still fires, and the thing the interaction was about always happens.
# ==============================================================================

effects {
    # A player arrives somewhere and hostile mobs around them are pushed back.
    kinetic-ward = [
        "[sound] entity.player.attack.sweep 1.0 1.2",
        "[particle] CRIT 20 0.8"
    ]

    # Lava a player poured is turned to obsidian rather than left to run.
    obsidian-recovery = [
        "[sound] item.bucket.fill_lava 1.0 1.0",
        "[particle] CAMPFIRE_COSY_SMOKE 6 0.2"
    ]

    # A block a player placed is refused because the island is at one of its limits.
    limit-refused = [
        "[sound] block.note_block.bass 1.0 0.5"
    ]

    # A mission is finished.
    mission-completed = [
        "[sound] ui.toast.challenge_complete 1.0 1.0"
    ]

    # The milestones below are what a server decorates. The command still gives its own
    # reply out of messages/; this is what happens beside it, and it is yours to write.

    # A player's island is made.
    island-created = [
        "[sound] ui.toast.challenge_complete 1.0 1.2"
    ]

    # A player joins an island they were invited to.
    member-joined = [
        "[sound] entity.player.levelup 1.0 1.4"
    ]

    # An upgrade is bought out of the island bank.
    upgrade-bought = [
        "[sound] entity.player.levelup 1.0 1.0"
    ]

    # A OneBlock island's block finishes a phase, just before the next begins.
    # %phase% is the key of the phase finished, %cycle% which round of the phases it was, from 1.
    oneblock-phase-finished = [
        "[sound] block.amethyst_block.chime 1.0 1.0"
    ]

    # One of the moments a OneBlock phase file writes happens, besides the moment's own list.
    # %phase% is the key of the phase, %break% how many of its blocks were broken, %cycle% which
    # round of the phases it is, from 1.
    oneblock-moment = [
        "[sound] block.note_block.bell 1.0 1.2"
    ]

    # A break of a OneBlock phase is lucky, as often as the phase file's lucky.chance says, and the
    # file writes no lists for it. %phase% is the key of the phase, %break% how many of its blocks
    # were broken, %cycle% which round of the phases it is, from 1.
    oneblock-lucky-break = [
        "[sound] entity.player.levelup 0.8 1.6",
        "[particle] HAPPY_VILLAGER 20 0.6",
        "[message] @oneblock.lucky"
    ]

    # A hostile creature is drawn for the OneBlock island's block, a few breaks before it comes, as
    # creature-warning in modules/oneblock.conf sets. The chat line comes out of messages/.
    # %creature% is the creature, %breaks% how many breaks from now it comes.
    oneblock-creature-coming = [
        "[sound] block.note_block.didgeridoo 0.8 0.6"
    ]

    # A OneBlock island's block starts a new phase. The chat line comes out of messages/.
    # %phase% is the key of the phase begun, %blocks% how many breaks it lasts, %cycle% which round
    # of the phases it begins, from 1.
    oneblock-phase-began = [
        "[sound] ui.toast.challenge_complete 1.0 0.8",
        "[particle] TOTEM_OF_UNDYING 30 0.6"
    ]

    # The acid sea burns a player on an AcidIsland island, at each check. The damage is dealt anyway.
    acid-sea-burns = [
        "[sound] block.fire.extinguish 0.5 1.6",
        "[particle] SMOKE 8 0.3"
    ]

    # Acid rain burns a player on an AcidIsland island, at each check.
    acid-rain-burns = [
        "[sound] block.fire.extinguish 0.3 1.9"
    ]

    # A player drinks a bottle of acid water on an AcidIsland island. The chat line comes out of messages/.
    acid-water-drunk = [
        "[sound] entity.generic.drink 1.0 0.6"
    ]

    # A player fills a clean bottle from a cauldron on an AcidIsland island. The plugin fills it in the
    # server's place, so the server's own sound does not play and this is what the player hears.
    acid-clean-water-filled = [
        "[sound] item.bottle.fill 1.0 1.0"
    ]

    # A player on an AcidIsland island breathes the fumes of a sulfur vent, at each check.
    acid-vent-fumes = [
        "[particle] CAMPFIRE_COSY_SMOKE 4 0.4"
    ]

    # An advancement grows a Boxed island's box. The chat line comes out of messages/.
    # %blocks% is how far it grew, %size% how wide the box is now.
    boxed-grew = [
        "[sound] entity.player.levelup 0.8 1.6"
    ]

    # A player steps onto a Brix plot and what they brought is kept aside. The chat line comes out of
    # messages/.
    brix-plot-entered = [
        "[sound] block.beacon.activate 0.6 1.4"
    ]

    # A player leaves a Brix plot and has what they brought back.
    brix-plot-left = [
        "[sound] block.beacon.deactivate 0.6 1.4"
    ]

    # A player steps onto a Parkour course and what they brought is kept aside. The chat line comes out
    # of messages/.
    parkour-course-entered = [
        "[sound] block.beacon.activate 0.6 1.4"
    ]

    # A player leaves a Parkour course and has what they brought back.
    parkour-course-left = [
        "[sound] block.beacon.deactivate 0.6 1.4"
    ]

    # A runner starts a run on a Parkour course. The chat line comes out of messages/.
    parkour-run-started = [
        "[sound] block.note_block.pling 0.8 1.2"
    ]

    # A runner reaches a checkpoint on a Parkour course.
    parkour-checkpoint = [
        "[sound] block.note_block.bell 0.8 1.5"
    ]

    # A runner reaches the finish of a Parkour course.
    # %time% is the run's time as the chat writes it, %millis% the same in milliseconds.
    parkour-finished = [
        "[sound] entity.player.levelup 0.8 1.2"
    ]

    # A runner sets their best time on a Parkour course, the first or a faster one.
    # %time% and %millis% as for parkour-finished; %was%, the time beaten, when there was one.
    parkour-record = [
        "[sound] ui.toast.challenge_complete 0.8 1.0",
        "[particle] TOTEM_OF_UNDYING 20 0.5"
    ]

    # Dry air hurts a player out of the water on a Poseidon island, at each check.
    poseidon-dry-air = [
        "[sound] entity.player.breath 0.6 0.7"
    ]

    # The sun burns a player out of the water on a Poseidon island, at each check.
    poseidon-sun-burns = [
        "[sound] block.fire.extinguish 0.4 0.8",
        "[particle] SMOKE 6 0.3"
    ]

    # The water hurts a Poseidon player who stays still in it too long, at each check.
    poseidon-still-drowns = [
        "[sound] entity.player.hurt_drown 0.8 1.0",
        "[particle] BUBBLE 10 0.4"
    ]
    # A loot roll lands on a rare thing, for the player who finds it.
    loot-rare = [
        "[sound] entity.experience_orb.pickup 1.0 1.2",
        "[particle] HAPPY_VILLAGER 12 0.5"
    ]
    # A loot roll lands on a legendary thing, for the player who finds it.
    loot-legendary = [
        "[sound] ui.toast.challenge_complete 1.0 1.4",
        "[particle] TOTEM_OF_UNDYING 30 0.6"
    ]

    # The crew of a TradeWinds vessel sets sail. The chat line comes out of messages/.
    # %port% is the id of the port it sails for, %seconds% how long the voyage lasts.
    vessel-sailed = [
        "[sound] entity.boat.paddle_water 1.0 0.8"
    ]

    # The crew of a TradeWinds vessel takes a contract, delivers one, or lets one run out of time.
    # The chat lines come out of messages/. %contract% is the contract's id, %item% and %count% what
    # it carries, and %port% where it is delivered. A contract's own reward runs beside delivered.
    # failed fires for every member of the vessel's island who is online.
    vessel-contract-taken = [
        "[sound] item.book.page_turn 1.0 1.0"
    ]
    vessel-contract-delivered = [
        "[sound] entity.player.levelup 0.8 1.2"
    ]
    vessel-contract-failed = [
        "[sound] block.note_block.bass 1.0 0.6"
    ]

    # Land is mirrored into the Upside Down the first time its chunk is made, for every player in the
    # Upside Down standing near it. %chunk_x% and %chunk_z% are the chunk's.
    upside-down-mirrored = [
        "[sound] block.sculk.spread 0.4 0.6"
    ]
}
