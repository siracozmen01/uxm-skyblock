# TradeWinds: an island that is a trading vessel on a sea of its own. The team sails it between the
# ports this file names, buys low and sells high from the vessel's cargo hold, and climbs the ranks.

# Whether islands can be made as TradeWinds vessels.
enabled = true

# The sea a new vessel is launched on. The vessel floats on its surface and players arrive on its deck.
sea {
    # How far the sea reaches from the vessel, each way. From 8 to 128.
    radius = 48
    # How deep the sea is. From 2 to 64.
    depth = 12
    # The block the sea lies on. One that does not fall.
    floor = "SANDSTONE"
}

# The vessel's cargo hold, opened with /is cargo by anyone of the island's team aboard it whose role lets
# them. A click moves a stack between the hold and the player. The hold belongs to the vessel, not to
# whoever filled it.
#
# The ranks a vessel climbs as it trades, lowest first. id names a rank here and in the language files,
# as tradewinds.ranks.<id>. volume is the trade, in the bank's minor units, a vessel has done at the
# markets to hold the rank; the first is held from no trade at all. hold-rows is how many rows of nine
# slots its hold has, from 1 to 6, never fewer than the rank before. The leaderboards rank vessels by the
# same trade, as uxm:tradewinds_trade.
ranks = [
    { id = "dinghy", volume = 0, hold-rows = 3 }
    { id = "sloop", volume = 500000, hold-rows = 4 }
    { id = "brigantine", volume = 2500000, hold-rows = 5 }
    { id = "galleon", volume = 10000000, hold-rows = 6 }
]

# The ports vessels sail between, in the order /is sail lists them. /is market opens the market of the
# port the vessel lies in. Each entry is a port: id is how this file and the language files name it, from
# 1 to 64 of a-z, 0-9, _ and -, and the name players see is tradewinds.ports.<id> in every language file.
#
# voyage-seconds is how long the voyage to the port takes, from 0 to 86400. icon is the item the port is
# shown as.
#
# market is what the port trades, in the order its window shows it. A price is per item, in the bank's
# minor units, so 250 is 2.50. pays is what the port pays when the crew sells it one, and asks is what it
# asks when the crew buys one; leave either out and the port does not trade that way. A port asks more
# for an item than it pays for one. lot is how many items one click sells or buys.
#
# contracts are the deliveries the port offers, taken with /is contracts while the vessel lies in it.
# Each is so many of a good carried to another port of this file within a time:
#   id        how this file and the language files name it, as tradewinds.contracts.names.<id>, from
#             1 to 64 of a-z, 0-9, _ and -, and never the same as another contract's
#   item      the good, as the server names the item
#   count     how many of it, from 1 to 3456
#   to        the port it is delivered to, not the one offering it
#   within    how long the crew has from taking it, from "1m" to "7d"
#   preview   the words its tile shows for its reward, plain words or a @key of the language files
#   reward    what runs when it is delivered, each an effect list as in modules/effects.conf:
#             deliverer once for the player who delivers it, members for every member of the island
#             who is online. %contract%, %item%, %count% and %port% say which and where.
# The goods leave the hold as the contract is delivered. One not delivered in time fails: its crew is
# told, and modules/effects.conf fires vessel-contract-failed for them. A contract delivered or failed
# can be taken again.
ports = [
    {
        id = "emerald-bay"
        icon = "EMERALD"
        voyage-seconds = 60
        market = [
            { item = "WHEAT", lot = 16, pays = 150, asks = 250 }
            { item = "PUMPKIN", lot = 8, pays = 400, asks = 700 }
            { item = "EMERALD", lot = 4, pays = 8000, asks = 12000 }
        ]
        contracts = [
            {
                id = "grain-run"
                item = "WHEAT"
                count = 64
                to = "saltmarsh"
                within = "30m"
                preview = "@tradewinds.contracts.previews.grain-run"
                reward { deliverer = [ "[give-money] 150" ] }
            }
        ]
    }
    {
        id = "saltmarsh"
        icon = "PRISMARINE_SHARD"
        voyage-seconds = 90
        market = [
            { item = "WHEAT", lot = 16, pays = 400, asks = 600 }
            { item = "SUGAR_CANE", lot = 32, pays = 100, asks = 180 }
            { item = "GLASS", lot = 16, pays = 500, asks = 800 }
        ]
    }
    {
        id = "ironhaven"
        icon = "IRON_INGOT"
        voyage-seconds = 120
        market = [
            { item = "SUGAR_CANE", lot = 32, pays = 260, asks = 350 }
            { item = "PUMPKIN", lot = 8, pays = 900, asks = 1200 }
            { item = "IRON_INGOT", lot = 8, pays = 1800, asks = 2600 }
            { item = "EMERALD", lot = 4, pays = 14000, asks = 18000 }
        ]
        contracts = [
            {
                id = "harvest-home"
                item = "PUMPKIN"
                count = 32
                to = "emerald-bay"
                within = "1h"
                preview = "@tradewinds.contracts.previews.harvest-home"
                reward { deliverer = [ "[give-money] 300" ] }
            }
        ]
    }
]

# What may happen to a vessel at sea. Each kind is rolled once as the vessel sets sail, as often as its
# chance says, from 0 to 1, and comes at a moment of the voyage. A chance left out is 0. A voyage that ends
# another way, as when an operator moves the vessel, takes its events with it.
#   storm     the voyage takes delay longer, at most "1d"
#   pirates   take toll from the island bank, in its minor units; when the bank cannot pay, or the toll
#             is 0, boarders of creature come next to each of the crew standing on the vessel, from 0 to 16
#   find      a roll of the loot table of loot/ named loot goes into the hold, whole or not at all; a
#             find the hold has no room for is lost
# Each fires its list in modules/effects.conf: vessel-storm, vessel-pirates-toll, vessel-pirates-boarded,
# vessel-find and vessel-find-lost.
voyage-events {
    storm { chance = 0.15, delay = "30s" }
    pirates { chance = 0.1, toll = 20000, creature = "pillager", boarders = 3 }
    find { chance = 0.1, loot = "treasure" }
}

# How many contracts one vessel holds at a time, from 1 to 54.
contracts-at-once = 3

# How a port's trade moves its prices, for every vessel alike. Each item the crews sell at a port lowers
# what it pays and asks for that good by per-item of the price, and each they buy raises both, never below
# floor or above ceiling of the prices written above. The push fades by half every half-life, so a market
# left alone comes back to its written prices. The push is kept, so a restart keeps the market.
# enabled = false keeps every price as written.
market-drift {
    enabled = true
    per-item = 0.001
    floor = 0.5
    ceiling = 1.5
    half-life = "6h"
}

# A vessel's standing in a port is the trade it did there. Every step of standing makes the port pay that
# many percent more for what the crew sells and ask that much less for what it buys, up to max-steps
# steps and never so far that the port pays more than it asks. step is in minor units.
standing {
    step = 50000
    percent = 1
    max-steps = 10
}
