# ==============================================================================
# UXPLIMA Skyblock - Island Missions & Quests Configuration (HOCON)
# Section 2.12 Specification
# ==============================================================================

missions {
    enabled = true

    # The time zone a mission's day and week turn in, as "Europe/Istanbul" or "UTC".
    # "system" is the zone the server runs in.
    reset-zone = "system"

    # Every mission takes repeat: "once" is finished once and stays finished, which is
    # what the missions window calls a challenge. "daily" starts again at midnight and
    # "weekly" at midnight between Sunday and Monday, and each pays again every time it
    # is finished. A mission that leaves repeat out is finished once. Only a mission
    # finished once counts towards the island level, which would otherwise fall every
    # time a day or a week turned.
    #
    # A mission may name the modes it belongs to, as modes = ["oneblock", "boxed"]:
    # only an island playing one of them is offered it and moves it on. A mission
    # that names none belongs to every mode. A mode no mode is called leaves the
    # mission out, with a line in the console. The modes are skyblock, oneblock,
    # chunkblock, acid_island, caveblock, skygrid, boxed, poseidon, stranger_realms,
    # parkour, brix and tradewinds.
    #
    # A mission may follow another, as after = "farming_wheat_1": it is offered once
    # that one is finished, which makes a chain of missions one after another.
    catalog {
        "farming_wheat_1" {
            branch = "FARMING"
            display-name = "@missions.catalog.farming_wheat_1.name"
            description = "@missions.catalog.farming_wheat_1.description"
            trigger-type = "CROP_HARVEST"
            target-filter = "WHEAT"
            required-amount = 50
            rewards {
                crystals = 10
                currency-minor-units = 500
                island-exp = 100
                commands = []
            }
        }

        "farming_carrot_1" {
            branch = "FARMING"
            display-name = "@missions.catalog.farming_carrot_1.name"
            description = "@missions.catalog.farming_carrot_1.description"
            trigger-type = "CROP_HARVEST"
            target-filter = "CARROT"
            required-amount = 100
            rewards {
                crystals = 15
                currency-minor-units = 1000
                island-exp = 150
                commands = []
            }
        }

        "mining_stone_1" {
            branch = "MINING"
            display-name = "@missions.catalog.mining_stone_1.name"
            description = "@missions.catalog.mining_stone_1.description"
            trigger-type = "BLOCK_BREAK"
            target-filter = "STONE"
            required-amount = 128
            rewards {
                crystals = 10
                currency-minor-units = 400
                island-exp = 100
                commands = []
            }
        }

        "slayer_zombie_1" {
            branch = "SLAYER"
            display-name = "@missions.catalog.slayer_zombie_1.name"
            description = "@missions.catalog.slayer_zombie_1.description"
            trigger-type = "MOB_KILL"
            target-filter = "ZOMBIE"
            required-amount = 25
            rewards {
                crystals = 20
                currency-minor-units = 1500
                island-exp = 250
                commands = []
            }
        }

        "builder_cobble_1" {
            branch = "BUILDER"
            display-name = "@missions.catalog.builder_cobble_1.name"
            description = "@missions.catalog.builder_cobble_1.description"
            trigger-type = "BLOCK_PLACE"
            target-filter = "COBBLESTONE"
            required-amount = 256
            rewards {
                crystals = 15
                currency-minor-units = 800
                island-exp = 150
                commands = []
            }
        }

        "adventure_fishing_1" {
            branch = "ADVENTURE"
            display-name = "@missions.catalog.adventure_fishing_1.name"
            description = "@missions.catalog.adventure_fishing_1.description"
            trigger-type = "FISHING"
            target-filter = "*"
            required-amount = 20
            rewards {
                crystals = 25
                currency-minor-units = 2000
                island-exp = 300
                commands = []
            }
        }

        "economy_iron_1" {
            branch = "ECONOMY"
            display-name = "@missions.catalog.economy_iron_1.name"
            description = "@missions.catalog.economy_iron_1.description"
            trigger-type = "ITEM_SUBMIT"
            target-filter = "IRON_INGOT"
            required-amount = 64
            rewards {
                crystals = 50
                currency-minor-units = 5000
                island-exp = 1000
                commands = []
            }
        }
    
        "daily_cobblestone" {
            branch = "MINING"
            display-name = "@missions.catalog.daily_cobblestone.name"
            description = "@missions.catalog.daily_cobblestone.description"
            trigger-type = "BLOCK_BREAK"
            target-filter = "COBBLESTONE"
            required-amount = 256
            repeat = "daily"
            rewards {
                crystals = 5
                currency-minor-units = 250
                island-exp = 50
                commands = []
            }
        }

        "daily_wheat" {
            branch = "FARMING"
            display-name = "@missions.catalog.daily_wheat.name"
            description = "@missions.catalog.daily_wheat.description"
            trigger-type = "CROP_HARVEST"
            target-filter = "WHEAT"
            required-amount = 64
            repeat = "daily"
            rewards {
                crystals = 5
                currency-minor-units = 250
                island-exp = 50
                commands = []
            }
        }

        "weekly_hunter" {
            branch = "SLAYER"
            display-name = "@missions.catalog.weekly_hunter.name"
            description = "@missions.catalog.weekly_hunter.description"
            trigger-type = "MOB_KILL"
            target-filter = "*"
            required-amount = 100
            repeat = "weekly"
            rewards {
                crystals = 30
                currency-minor-units = 2500
                island-exp = 400
                commands = []
            }
        }

        "weekly_angler" {
            branch = "ADVENTURE"
            display-name = "@missions.catalog.weekly_angler.name"
            description = "@missions.catalog.weekly_angler.description"
            trigger-type = "FISHING"
            target-filter = "*"
            required-amount = 50
            repeat = "weekly"
            rewards {
                crystals = 25
                currency-minor-units = 2000
                island-exp = 300
                commands = []
            }
        }
    }
}
