# ==============================================================================
# UXPLIMA Skyblock - Island Missions & Quests Configuration (HOCON)
# Section 2.12 Specification
# ==============================================================================

missions {
    enabled = true

    # The time zone a mission's day and week turn in, as "Europe/Istanbul" or "UTC".
    # "system" is the zone the server runs in.
    reset-zone = "system"

    # How many daily missions each island is offered a day, drawn from every daily
    # mission its mode plays and drawn again when the day turns. Every island draws
    # its own, and the same all day, on every server. 0 offers every daily mission.
    daily-slots = 0

    # Every mission takes repeat: "once" is finished once and stays finished, which is
    # what the missions window calls a challenge. "daily" starts again at midnight and
    # "weekly" at midnight between Sunday and Monday, and each pays again every time it
    # is finished. A mission that leaves repeat out is finished once. Only a mission
    # finished once counts towards the island level, which would otherwise fall every
    # time a day or a week turned.
    #
    # trigger-type is what a mission counts, target-filter what it counts it for
    # ("*" or left out for anything), and required-amount how many:
    #   BLOCK_BREAK, BLOCK_PLACE    a block, by its name, as STONE
    #   CROP_HARVEST                a crop broken ripe, as WHEAT
    #   MOB_KILL                    a creature killed, as ZOMBIE
    #   FISHING                     a catch
    #   CRAFT                       an item crafted, as BREAD
    #   SMELT                       an item taken out of a furnace, as IRON_INGOT
    #   ENCHANT                     an item enchanted, as DIAMOND_SWORD
    #   BREW                        a potion brewed at a stand the player opened,
    #                               by its kind, as SWIFTNESS
    #   EXPERIENCE                  experience points gained
    #   ITEM_SUBMIT                 items handed in from the missions window
    #   ONEBLOCK_BREAK              a OneBlock island's block broken, by the phase it
    #                               was broken in
    #   ONEBLOCK_PHASE              a OneBlock island reaching a phase, by its key
    #   BOXED_GROW                  a Boxed island's box growing, by how far
    #   LEVEL_REACH                 the island reaching a level; required-amount is
    #                               the level
    #   BANK_BALANCE                the island bank holding a balance, in whole units
    #                               of the server's money
    #
    # A mission may ask for several things at once. Write lines = [ ... ] in place of
    # trigger-type, target-filter and required-amount, one { } for each, as
    #   lines = [
    #       { trigger-type = "BLOCK_BREAK", target-filter = "STONE", required-amount = 64 }
    #       { trigger-type = "MOB_KILL", target-filter = "ZOMBIE", required-amount = 10 }
    #   ]
    # Each line is counted on its own, and the mission is finished, and pays, when
    # every line is. A line cannot count ITEM_SUBMIT.
    #
    # A mission may name the modes it belongs to, as modes = ["oneblock", "boxed"]:
    # only an island playing one of them is offered it and moves it on. A mission
    # that names none belongs to every mode. A mode no mode is called leaves the
    # mission out, with a line in the console. The modes are skyblock, oneblock,
    # chunkblock, acid_island, caveblock, skygrid, boxed, poseidon, stranger_realms,
    # parkour, brix and tradewinds.
    #
    # A mission may follow another, as after = "farming_wheat_1": it is offered once
    # that one is finished, which makes a chain of missions one after another.
    catalog {
        # The packs of the modes. Each is offered only to an island playing its mode, and each
        # chain one mission after another.

        "oneblock_phase_underground" {
            branch = "ADVENTURE"
            display-name = "@missions.catalog.oneblock_phase_underground.name"
            description = "@missions.catalog.oneblock_phase_underground.description"
            trigger-type = "ONEBLOCK_PHASE"
            target-filter = "underground"
            required-amount = 1
            repeat = "once"
            modes = ["oneblock"]
            rewards {
                crystals = 10
                currency-minor-units = 1000
                island-exp = 150
                commands = []
            }
        }

        "oneblock_phase_snow" {
            branch = "ADVENTURE"
            display-name = "@missions.catalog.oneblock_phase_snow.name"
            description = "@missions.catalog.oneblock_phase_snow.description"
            trigger-type = "ONEBLOCK_PHASE"
            target-filter = "snow"
            required-amount = 1
            repeat = "once"
            modes = ["oneblock"]
            after = "oneblock_phase_underground"
            rewards {
                crystals = 15
                currency-minor-units = 1500
                island-exp = 200
                commands = []
            }
        }

