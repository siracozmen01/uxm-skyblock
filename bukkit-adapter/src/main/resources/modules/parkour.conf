# Parkour: an island that is a course. Its team builds the course; anybody runs it. A run starts on a
# plate over the start block, is saved at every checkpoint plate, and ends on a plate over the finish
# block. The best time of every runner on every course is kept.

# Whether islands can be made as Parkour courses.
enabled = true

# What marks a course.
markers {
    # The plate a run starts and ends on.
    plate = "LIGHT_WEIGHTED_PRESSURE_PLATE"
    # The block under a plate that makes it the start.
    start-under = "EMERALD_BLOCK"
    # The block under a plate that makes it the finish.
    finish-under = "GOLD_BLOCK"
    # The plate that is a checkpoint wherever it stands. A runner who falls is put back on the last one.
    checkpoint = "HEAVY_WEIGHTED_PRESSURE_PLATE"
}

runs {
    # How far below the last checkpoint, or the start, a runner may fall before being put back on it.
    fall-depth = 8
    # How long a run may take before it is dropped.
    time-limit = "30m"
    # How many runners the course command shows, fastest first. From 1 to 100.
    board-size = 10
    # Whether each checkpoint says how long the run took to it, and how far ahead of or behind the
    # runner's best run at the same checkpoint.
    splits = true
}

# What a finish pays. Each is a list of action lines, as in effects.conf, run for the runner in the
# order written: [console] lines run a command, as "[console] eco give %player_name% 100". %time% is the
# run's time, %millis% the same in milliseconds, and %was% the time beaten, empty when there was none.
rewards {
    # The first time a runner finishes a course.
    first-finish = []
    # Each time a runner beats their own best on a course.
    personal-best = []
    # Each time a runner finishes a course faster than anybody has, the first finish on a course included.
    course-record = []
    # How long after a runner is paid a new best or a record on a course the same list pays them there
    # again. A first finish is paid once for good. Rewards are never paid to the course's own team, who
    # build it.
    again-after = "24h"
    # A run quicker than this pays nothing, so a course of a step or two earns no reward.
    shortest-run = "5s"
}

# The tags a course's team gives it with the coursetag command: one difficulty and one category, each
# by a name below. The language files word each one under parkour.difficulties and parkour.categories;
# a name they do not word is shown as written. Add, take off or rename them freely.
tags {
    # Easiest first.
    difficulties = ["easy", "medium", "hard", "expert"]
    categories = ["classic", "speed", "maze", "dropper", "puzzle"]
}

# How runners rate a course with the courserate command: a runner who has finished a course, and is not
# of its team, gives it from 1 star to the most below, from 2 to 10. A second rating takes the place of
# the first.
ratings {
    enabled = true
    stars = 5
}

# The ghost a runner races. Every runner's best run on a course is recorded as it goes, and the next run
# is raced against it: an item only the runner sees retraces the run, from the start plate to the finish.
ghost {
    enabled = true
    # Whose ghost is raced: RECORD for the course's fastest run, whoever ran it, or OWN for the runner's
    # own best, and the course's fastest before they have one.
    against = "RECORD"
    # How often a run is sampled. The ghost moves on a straight line between two samples. At least 50ms.
    sample-every = "100ms"
    # The item the ghost is drawn as. A player head wears the face of whoever ran it.
    item = "PLAYER_HEAD"
    # How far above the ground the item floats, how large it is drawn, from above 0 up to 4, and
    # whether it glows, so it shows through the course.
    height = 1.4
    scale = 0.6
    glow = true
}

# The game modes on a course, which is how a run is played. Whatever a player brings to a course is kept
# aside while they are on it and given back when they leave: their items, experience, effects and mode.
# Nothing the team makes in creative leaves the course, and a run starts empty handed.
modes {
    # The mode of the course's own team while they are on it and not running: how the course is built.
    build = "CREATIVE"
    # The mode of anybody running, and of everybody else on the course: SURVIVAL or ADVENTURE.
    play = "SURVIVAL"
    # A player with this permission keeps their own mode and items on a course. Leave it empty for nobody.
    keep-permission = "uxmskyblock.parkour.keepmode"
}
