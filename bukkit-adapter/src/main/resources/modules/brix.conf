# Brix: an island that is a creative building plot. Its team builds in creative; nothing hurts, nobody
# goes hungry, and there is nothing to progress through. Visitors look at what was built.

# Whether islands can be made as Brix plots.
enabled = true

# The flat ground a new plot is laid on. The top layer is the one players arrive on. A preset that wants
# its own terrain names a schematic and leaves "uxm:plot" out of its start list.
ground {
    # How far the ground reaches from the centre, each way. From 0 to 128.
    radius = 32
    # The layers of the ground, top first, at most 64. An empty list lays no ground: the plot is void.
    layers = ["GRASS_BLOCK", "DIRT", "DIRT", "DIRT", "BEDROCK"]
}

# The game modes on a plot. Whatever a player brings to a plot is kept aside while they are on it and
# given back when they leave: their items, experience, effects and mode. Nothing held on a plot leaves it.
modes {
    # The mode of the plot's own team while they are on it.
    build = "CREATIVE"
    # The mode of everybody else on the plot. Not creative and not spectator.
    visit = "ADVENTURE"
    # A player with this permission keeps their own mode and items on a plot. Empty for nobody.
    keep-permission = "uxmskyblock.brix.keepmode"
}

# What cannot happen on a plot. Items are never dropped or thrown on a plot and an ender chest does not
# open there, whatever is written here: that is what keeps creative items on the plot.
rules {
    # Nothing hurts a player on a plot, but the void below it.
    no-damage = true
    # Nobody goes hungry on a plot.
    no-hunger = true
    # No creature comes of itself onto a plot: not out of the dark, not with a patrol or a raid. One a
    # player brings, from an egg, a spawner or a command, or by breeding, comes as it would.
    no-spawning = true
}
