# AcidIsland: an island that stands in an acid sea. The sea burns whoever swims in it, and acid rain
# burns whoever it falls on. Water taken from the sea is acid too: a bottle of it poisons the one who
# drinks it until it is made clean. Rain a cauldron catches is clean already, but a cauldron a bucket
# of sea water was poured into holds the sea until it is emptied.

# Whether islands can be made as AcidIsland islands.
enabled = true

# The sea an AcidIsland island is made in. It fills the air around the island and never replaces a
# block the island already has.
sea {
    # How many blocks below the island's start height the surface stands.
    below-island = 2
    # How many blocks of water, above the floor.
    depth = 4
    # How far from the island's centre the sea reaches. Keep it inside half the grid spacing, so two
    # islands' seas never meet.
    radius = 64
    # The block the sea stands on. A block that falls, such as sand or gravel, would drop out from
    # under the sea and let it drain away, so one of those is replaced by sandstone.
    floor = "SANDSTONE"
    # Sulfur vents: magma on the floor that pulls a swimmer down, and fumes that reach whoever is near.
    vents {
        # The chance that one column of the floor is a vent. 0 lays none.
        chance = 0.004
        # How many blocks sideways the fumes of a vent reach.
        reach = 3
        # Effects the fumes give, each written name:amplifier:seconds. No effect keeps them off.
        effects = ["nausea:0:6", "poison:1:3"]
    }
    # Geysers: soul sand on the floor that throws a swimmer up out of the sea.
    geysers {
        # The chance that one column of the floor is a geyser. 0 lays none.
        chance = 0.004
    }
}

hazard {
    # How often each player on an AcidIsland island is checked.
    check-every = "1s"
    # Health taken at each check from a player in the sea. A heart is 2.
    water-damage = 2.0
    # Health taken at each check from a player the rain falls on.
    rain-damage = 1.0
    # Whether anything worn on the head keeps the rain off.
    helmet-blocks-rain = true
    # Effects, by name, that keep a player safe in the sea.
    water-protection = ["water_breathing"]
    # Effects the sea gives, each written name:amplifier:seconds.
    water-effects = ["poison:0:3"]
    # A full set of armour, all four pieces, of one of these sets keeps the acid off. A set is named
    # as each piece's name starts: "netherite" for netherite_helmet and the rest, as "diamond",
    # "iron", "golden", "chainmail", "leather" or "copper". sets = [] lets no armour keep it off.
    armour {
        sets = ["netherite"]
        # Whether such a set keeps the sea off.
        sea = true
        # Whether such a set keeps the rain off.
        rain = true
        # The durability each piece loses at each check it keeps the acid off. 0 wears nothing.
        wear = 1
    }
}

# What the sea does to what lies and swims in it, looked at within reach blocks of each player on an
# AcidIsland island at each check. reach = 0 looks at nothing.
sea-life {
    reach = 32
    items {
        # Whether an item lying in the sea dissolves, once it has lain there as long as after.
        dissolve = true
        after = "10s"
    }
    creatures {
        # Whether a creature in the sea is hurt, by damage at each check. A heart is 2.
        burn = true
        damage = 2.0
        # The creatures, by type, the sea does not hurt: those that live in it.
        spared = ["drowned", "guardian", "elder_guardian"]
    }
}

# How a bottle of acid water is made clean.
purification {
    # Smelting it in a furnace. A bucket of water smelted comes out clean too, and poured into a
    # cauldron keeps it clean.
    furnace = true
    # Brewing it with coal in a brewing stand.
    brewing-with-coal = true
}
