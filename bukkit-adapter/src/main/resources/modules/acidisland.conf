# AcidIsland: an island that stands in an acid sea. The sea burns whoever swims in it, and acid rain
# burns whoever it falls on. Water taken from the sea is acid too: a bottle of it poisons the one who
# drinks it until it is made clean. Rain a cauldron catches is clean already, but a cauldron a bucket
# of sea water was poured into holds the sea until it is emptied.

# Whether islands can be made as AcidIsland islands.
enabled = true

# The sea an AcidIsland island is made in. It fills the air around the island and never replaces a
# block the island already has.
sea {
    # How many blocks below the island's start height the surface stands.
    below-island = 2
    # How many blocks of water, above the floor.
    depth = 4
    # How far from the island's centre the sea reaches. Keep it inside half the grid spacing, so two
    # islands' seas never meet.
    radius = 64
    # The block the sea stands on. A block that falls, such as sand or gravel, would drop out from
    # under the sea and let it drain away, so one of those is replaced by sandstone.
    floor = "SANDSTONE"
    # Sulfur vents: magma on the floor that pulls a swimmer down, and fumes that reach whoever is near.
    vents {
        # The chance that one column of the floor is a vent. 0 lays none.
        chance = 0.004
        # How many blocks sideways the fumes of a vent reach.
        reach = 3
        # Effects the fumes give, each written name:amplifier:seconds. No effect keeps them off.
        effects = ["nausea:0:6", "poison:1:3"]
    }
    # Geysers: soul sand on the floor that throws a swimmer up out of the sea.
    geysers {
        # The chance that one column of the floor is a geyser. 0 lays none.
        chance = 0.004
    }
    # The sea's floor. blocks are what it is made of, each written BLOCK weight: each column takes one
    # by its weight, the same for the same island every time. A block that falls, as sand, is left
    # out, and with none left the floor is the floor above. thickness is how many blocks thick it is,
    # from 1 to 16. mounds is how far it rises at most, in gentle mounds, from 0 to 15; a block of
    # water always stays above, and vents and geysers lie only where it does not rise.
    bed {
        blocks = ["SANDSTONE 6", "SMOOTH_SANDSTONE 2", "TUFF 2", "CLAY 1", "YELLOW_TERRACOTTA 1"]
        thickness = 3
        mounds = 2
    }
    # Structures buried in the floor around the island, laid as Poseidon lays its wrecks: each group
    # lays count of its templates, by key, distance blocks from the centre and spread evenly around
    # it, and gives each chest a loot table from loot, in turn. sink is how deep each sits in the
    # floor, from 0 to 16; a structure fills the floor's blocks and water, keeps the island, and
    # reaches no lower than the floor's bottom. Keep distance and the template inside the radius.
    # groups = {} buries nothing.
    buried {
        sink = 2
        groups {
            ruins {
                templates = [
                    "minecraft:underwater_ruin/cracked_1",
                    "minecraft:underwater_ruin/cracked_2",
                    "minecraft:underwater_ruin/cracked_3",
                    "minecraft:underwater_ruin/cracked_4",
                    "minecraft:underwater_ruin/cracked_5",
                    "minecraft:underwater_ruin/cracked_6",
                    "minecraft:underwater_ruin/cracked_7",
                    "minecraft:underwater_ruin/cracked_8"
                ]
                count = 4
                distance = 34
                loot = ["minecraft:chests/underwater_ruin_small"]
            }
            temple {
                templates = [
                    "minecraft:underwater_ruin/big_cracked_1",
                    "minecraft:underwater_ruin/big_cracked_2",
                    "minecraft:underwater_ruin/big_cracked_3",
                    "minecraft:underwater_ruin/big_cracked_8"
                ]
                count = 1
                distance = 48
                loot = ["minecraft:chests/underwater_ruin_big"]
            }
        }
    }
    # The acid tide. The sea rises rise blocks over half of period and falls back over the other half,
    # a block at a time, by the clock, so every server of a network keeps the same tide. Water is
    # added only over the sea, never on an island, and taken away again as the tide falls. It is
    # brought to the tide's level every check-every, around the islands players are on. rise = 0
    # keeps the sea still. The effects acid-tide-rising and acid-tide-falling fire at each block.
    tide {
        rise = 2
        period = "20m"
        check-every = "10s"
    }
    # How the sea looks. biome is painted over the sea, from its floor to the sky, when an island is
    # made. "uxmskyblock:sulfur_sea" is the plugin's own, drawn in the colours below, each written
    # #rrggbb: water, water-fog seen from under it, fog above it and sky. The plugin writes it into a
    # data pack at start, so a change to the colours shows after a restart. Any biome the game or a
    # data pack has may be named instead, and "" leaves the biome the world made. A sea painted with
    # the plugin's biome keeps it in its chunks; with the plugin gone, the game reads it as plains.
    look {
        biome = "uxmskyblock:sulfur_sea"
        water = "#ffe66d"
        water-fog = "#565f6b"
        fog = "#fff3a8"
        sky = "#e8ecf5"
    }
}

hazard {
    # How often each player on an AcidIsland island is checked.
    check-every = "1s"
    # Health taken at each check from a player in the sea. A heart is 2.
    water-damage = 2.0
    # Health taken at each check from a player the rain falls on.
    rain-damage = 1.0
    # Whether anything worn on the head keeps the rain off.
    helmet-blocks-rain = true
    # Effects, by name, that keep a player safe in the sea.
    water-protection = ["water_breathing"]
    # Effects the sea gives, each written name:amplifier:seconds.
    water-effects = ["poison:0:3"]
    # A full set of armour, all four pieces, of one of these sets keeps the acid off. A set is named
    # as each piece's name starts: "netherite" for netherite_helmet and the rest, as "diamond",
    # "iron", "golden", "chainmail", "leather" or "copper". sets = [] lets no armour keep it off.
    armour {
        sets = ["netherite"]
        # Whether such a set keeps the sea off.
        sea = true
        # Whether such a set keeps the rain off.
        rain = true
        # The durability each piece loses at each check it keeps the acid off. 0 wears nothing.
        wear = 1
    }
}

# What the sea does to what lies and swims in it, looked at within reach blocks of each player on an
# AcidIsland island at each check. reach = 0 looks at nothing.
sea-life {
    reach = 32
    items {
        # Whether an item lying in the sea dissolves, once it has lain there as long as after.
        dissolve = true
        after = "10s"
    }
    creatures {
        # Whether a creature in the sea is hurt, by damage at each check. A heart is 2.
        burn = true
        damage = 2.0
        # The creatures, by type, the sea does not hurt: those that live in it.
        spared = ["drowned", "guardian", "elder_guardian"]
    }
}

# What a bottle of clean water drunk on an AcidIsland island does. heals is the health it gives back,
# up to the drinker's most, 0 for none; a heart is 2. effects are given too, each written
# name:amplifier:seconds, as "regeneration:0:5".
clean-water {
    heals = 4.0
    effects = []
}

# How a bottle of acid water is made clean.
purification {
    # Smelting it in a furnace. A bucket of water smelted comes out clean too, and poured into a
    # cauldron keeps it clean.
    furnace = true
    # Brewing it with coal in a brewing stand.
    brewing-with-coal = true
}
