# ==============================================================================
# UXPLIMA Skyblock - What a player carries in each kind of world
#
# A server that plays several game modes would give a player one inventory, one
# level and one set of advancements for all of them: a stack of diamonds walks
# from a classic island onto a fresh Boxed one, and a Boxed box never grows for
# an advancement the player earned somewhere else. So worlds fall into groups,
# and a player who crosses from one group to another puts down what they carry
# in the group they leave and picks up what they had in the group they enter.
#
# What is kept is written on the player, in their own saved data, so it is saved
# exactly when the rest of the player is. A crash rolls both back together, and
# nothing is lost or had twice.
#
# A world no group names, such as a Nether every mode shares, keeps what the
# player brought, so a Boxed player in the Nether still carries their Boxed things.
# ==============================================================================

# Whether anything is kept apart at all.
enabled = true

# The groups, each a name and its worlds. Worlds in one group share what a player
# carries. Leave it empty for a group of each world a preset makes islands in, so
# every game mode with a world of its own keeps its own.
#
#   groups {
#     main = ["world"]
#     boxed = ["boxed"]
#     realms = ["realms"]
#   }
groups {
}

# What a group keeps apart. Something switched off is carried everywhere.
keeps {
    inventory = true
    ender-chest = true
    experience = true
    health = true
    hunger = true
    effects = true
    # Every advancement but the recipe ones, which unlock the same recipes everywhere.
    advancements = true
}
