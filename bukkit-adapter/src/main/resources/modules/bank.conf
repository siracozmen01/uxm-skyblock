# ==============================================================================
# UXPLIMA Skyblock - Island Bank & Upkeep Configuration (HOCON)
# Canonical Section 2.39: Island Bankruptcy & Upkeep Failure Subsystem
# ==============================================================================
bank {
    # How long a settled idempotency record is kept. Every deposit, withdrawal,
    # upgrade purchase, shop trade and upkeep charge writes one so a retry of it is
    # answered rather than applied twice, and it has to outlive every retry anything
    # can make. A record that never settled is never swept, whatever this says.
    operation-retention = "30d"

    # Upkeep fee and bankruptcy escalation system
    upkeep {
        # Whether recurring upkeep debiting is active
        enabled = false

        # Cycle interval between upkeep runs (e.g. 24h)
        interval = "24h"

        # Base flat fee per cycle (currency units, e.g. 500.00 = 50000 minor units)
        base-fee = 500.00

        # Additional fee per registered island member (currency units, e.g. 100.00 = 10000 minor units)
        per-member-fee = 100.00

        # Duration before an island in GRACE escalates to LOCKED lockout
        grace-duration = "72h"

        # Automatically remediate accumulated debt upon bank deposit if funds suffice
        auto-remediate-on-deposit = true
    }

    # The island's own money, as the bank window draws it. It is always kept, so it has no
    # "enabled", and it stands among the currencies below as one of them.
    #
    #   display-name  its name, a key of the language files written with a leading @, or your words
    #   icon          the item its tile wears
    #   order         where it stands among the currencies, the lowest first
    #   quick         the amounts its window moves in one click. The window shows the first two.
    money {
        display-name = "@bank.currencies.money"
        icon = "GOLD_INGOT"
        order = 0
        quick = [100, 1000]
    }

    # The currencies an island bank keeps beside the island's own money.
    #
    # The island's own money is the server's economy, read through Vault: it is what upgrades,
    # the shop and upkeep spend, and it is always kept. Everything listed here is kept too, so
    # members can put their experience, their points or a stack of diamonds away together and
    # take them out again. Each is kept in whole numbers.
    #
    # The id of a currency is what the bank keeps it under, and what a player writes after an
    # amount: /is bank deposit 50 experience. It is lower case letters, digits, _ and -, and it
    # may not be primary, crystals, exp or vault, which the bank keeps for itself. Once an
    # island holds some of a currency, keep its id: turn it off with "enabled = false" rather
    # than renaming or deleting it, so what the islands hold still has a name.
    #
    # Every currency takes:
    #
    #   type          where it lives, one of the nine below
    #   order         where it stands among the others in the bank window, the lowest first
    #   enabled       whether islands can use it now
    #   display-name  its name, a key of the language files written with a leading @, or your
    #                 own words
    #   icon          the item its tile in the bank window wears
    #   quick         the amounts its window moves in one click, [10, 100] when left out. The
    #                 window shows the first two
    #
    # Nine types:
    #
    #   vault           the Vault economy, for a second balance on a server that runs two
    #   vaultunlocked   VaultUnlocked, the modern Vault. currency-name picks one of its currencies
    #   playerpoints    PlayerPoints
    #   ecobits         EcoBits. currency-name is the id you gave the currency in EcoBits
    #   treasury        Treasury. currency-name picks one of its currencies, wait-for how long a
    #                   call may take before the bank gives up on it, "10s" when left out
    #   item            an item in the inventory, as material = "minecraft:diamond". Only the
    #                   plain item counts, never a renamed or enchanted one
    #   experience      the player's experience, unit = "points" or "levels". Points are the fair
    #                   count: a level is worth more the higher it is
    #   bridge          any other economy plugin, described by hand. See the example at the end
    #   placeholder     a balance read through a placeholder and moved by two console lines
    #
    # A currency whose plugin is not installed, or which is described wrongly, stays out of the
    # bank and the console says why. The rest of the bank is not touched. So every currency below
    # ships turned on: points shows only on a server that runs PlayerPoints.
    #
    # Experience and items live in the player, so they move only while the player is online,
    # which is always the case for the player putting them in or taking them out.
    currencies {

        experience {
            type = "experience"
            order = 10
            enabled = true
            display-name = "@bank.currencies.experience"
            icon = "EXPERIENCE_BOTTLE"
            unit = "points"
            quick = [10, 100]
        }

        points {
            type = "playerpoints"
            order = 20
            enabled = true
            display-name = "@bank.currencies.points"
            icon = "AMETHYST_SHARD"
            quick = [10, 100]
        }

        diamonds {
            type = "item"
            order = 30
            enabled = true
            display-name = "@bank.currencies.diamonds"
            icon = "DIAMOND"
            material = "minecraft:diamond"
            quick = [1, 16]
        }

        # gems {
        #     type = "ecobits"
        #     order = 40
        #     enabled = true
        #     display-name = "Gems"
        #     icon = "EMERALD"
        #     currency-name = "gems"
        # }

        # A balance a placeholder answers with, moved by two console lines. {player} is the
        # name of the player, {uuid} their id and {amount} the number. thousands is what your
        # plugin puts between groups of three, taken out before the number is read.
        #
        # tokens {
        #     type = "placeholder"
        #     order = 50
        #     enabled = true
        #     display-name = "Tokens"
        #     icon = "SUNFLOWER"
        #     placeholder = "%tokenmanager_tokens%"
        #     take = "tm remove {player} {amount}"
        #     give = "tm add {player} {amount}"
        #     thousands = ","
        # }

        # Any other economy plugin, described rather than compiled against.
        #
        # class      the class that answers
        # access     how to reach it: service, static, plugin or class
        # accessor   for static, the method that answers; a dot chains two of them
        # balance    the method that reads a balance
        # take       the method that takes an amount away
        # give       the method that pays an amount in
        # argument   what the methods take for the player: offline-player, player-id or
        #            player-name
        # answer     what take and give hand back: boolean, vault-response or nothing
        #
        # For a plugin with several currencies, currency-name names one, and currency-class
        # with currency-lookup turns that name into the object its methods take. take-negates
        # is true for a plugin that has one adjust method and no take, and naming is what to
        # call this plugin to an economy that asks who is moving the money.
        #
        # coins {
        #     type = "bridge"
        #     order = 60
        #     enabled = true
        #     display-name = "Coins"
        #     icon = "GOLD_INGOT"
        #     plugin = "CoinsEngine"
        #     class = "su.nightexpress.coinsengine.api.CoinsEngineAPI"
        #     access = "static"
        #     accessor = "getInstance"
        #     balance = "getBalance"
        #     take = "removeBalance"
        #     give = "addBalance"
        #     argument = "offline-player"
        #     answer = "nothing"
        #     currency-name = "coins"
        # }
    }
}
