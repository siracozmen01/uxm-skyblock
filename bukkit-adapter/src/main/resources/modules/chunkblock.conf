# ChunkBlock: an island that starts as the one chunk its magic block stands in. The block comes back
# as something else each time it is broken, the way a OneBlock island's does, and draws from the
# phases in modules/oneblock.conf. The island opens the chunks beside it, each at the price of the
# grade it falls into, written under tiers below.
#
# A chunk priced by the level alone is held, not bought. An island keeps it while its level stays at
# or above what that chunk needed. When the level falls, the newest such chunks close first, and
# players standing in one are moved to the island's spawn. Nothing built in a closed chunk is
# removed; it waits there. A chunk whose price took anything else was bought, and stays open.
#
# A chunk opens only beside the chunks already open, never across a corner, and never past the
# island's edge.

# Whether islands can be made as ChunkBlock islands.
enabled = true

# The island level the first chunks beyond the starting one need, one by one.
unlock-levels = [1, 3, 6, 10, 15]

# How many more levels each chunk after the list needs than the one before it.
then-every = 5

# A permission node whose holder walks and builds in closed chunks, such as staff helping a player.
# Empty lets nobody through.
bypass-permission = ""

# The grades a chunk falls into. Each chunk of each island falls into one grade, drawn once from
# the grades of its ring and kept for good, so a chunk shows the same price to every member and
# after every restart. The ring is how far the chunk lies from the island's first chunk: the eight
# around it are ring 1, the sixteen around those ring 2, and so on.
#
# With no grade written, every chunk is priced by the level ladder above, the way ChunkBlock
# always worked, and a chunk closes again when the island's level falls below it. A chunk of a
# grade that takes anything else is bought, and a bought chunk never closes.
#
#   name      what a player reads, a key of the language files written with a leading @, or
#             your words. It is @chunkblock.tiers.<grade> when left out.
#   rings     the rings it falls on: "1-2", "3", or "6+" for six and every ring past it. A
#             ring no grade names takes the grades of the nearest ring one does.
#   weight    how often it falls against the other grades of the same ring. 1 when left out.
#   cost      every line opening a chunk of it takes. Members pay it a little at a time, and
#             what one member hands in counts for everybody.
#   bypass    lines that open a chunk of it at once instead, all of them together. Empty when
#             nothing skips the cost.
#   rewards   action lines fired for the player who opens it, in the grammar of
#             modules/effects.conf.
#   points    the chunk points opening one gives the island. A cost may ask for them back.
#
# A cost or bypass line is one of:
#
#   money <amount> [player|island]            the economy's money, from the player who pays
#                                             or from the island bank. Player when left out.
#   currency <id> <amount> [player|island]    a currency of modules/bank.conf, such as points
#                                             through PlayerPoints, from the player or the bank
#   item <item> <amount>                      items handed in from the inventory
#   points <amount>                           the island's chunk points
#   level <level>                             an island level, held and not spent. "level
#                                             ladder" asks for the ladder's level instead.
#
# A line this file cannot read is logged and left out, and so is a grade with no cost left.
tiers {
    common {
        rings = "1-2"
        weight = 3
        cost = [
            "level ladder",
            "item cobblestone 128",
            "item oak_log 32"
        ]
        bypass = ["currency points 25 player"]
        rewards = [
            "[sound] entity.player.levelup 1.0 1.2",
            "[particle] HAPPY_VILLAGER 30 1.5"
        ]
        points = 1
    }
    rare {
        rings = "1-5"
        weight = 1
        cost = [
            "level ladder",
            "item iron_ingot 16",
            "money 2500 island"
        ]
        bypass = ["currency points 60 player"]
        rewards = [
            "[sound] entity.player.levelup 1.0 1.0",
            "[particle] TOTEM_OF_UNDYING 40 1.5",
            "[give-money] 500"
        ]
        points = 2
    }
    far {
        rings = "3-5"
        weight = 2
        cost = [
            "level ladder",
            "item copper_ingot 64",
            "item bread 16",
            "money 5000 island"
        ]
        bypass = ["currency points 90 player"]
        rewards = [
            "[sound] entity.player.levelup 1.0 1.0",
            "[particle] HAPPY_VILLAGER 40 2.0"
        ]
        points = 2
    }
    epic {
        rings = "6+"
        cost = [
            "level ladder",
            "item diamond 8",
            "money 20000 island",
            "points 5"
        ]
        bypass = ["currency points 150 player"]
        rewards = [
            "[sound] ui.toast.challenge_complete 1.0 1.0",
            "[particle] END_ROD 60 2.0",
            "[give-money] 2000"
        ]
        points = 3
    }
}
