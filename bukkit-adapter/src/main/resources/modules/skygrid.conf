# SkyGrid: an island that is a sparse grid of lone blocks hanging in the sky, one every few blocks
# along each axis. Players arrive on a safe block at its centre and bridge from block to block. A
# chest in the grid holds a few of the chest items, and a spawner raises one of its dimension's
# creatures.

# Whether islands can be made as SkyGrid islands.
enabled = true

# How many blocks from one grid block to the next, along each axis.
spacing = 4
# How far the grid reaches sideways from the island's centre. Keep it inside half the grid spacing
# of the islands, so two islands' grids never meet.
radius = 48
# How far the grid reaches down and up from the block players arrive on.
below = 64
above = 32

# The block players arrive standing on.
spawn-block = "GRASS_BLOCK"

# What a chest in the grid holds when its palette names no loot table: rolls of the items, each
# written ITEM:min:max.
chests {
    rolls = 3
    items = [
        "OAK_SAPLING:1:2",
        "BONE_MEAL:2:6",
        "WHEAT_SEEDS:1:4",
        "SUGAR_CANE:1:3",
        "CACTUS:1:2",
        "MELON_SEEDS:1:2",
        "PUMPKIN_SEEDS:1:2",
        "ICE:1:2",
        "WATER_BUCKET:1:1",
        "LAVA_BUCKET:1:1",
        "IRON_INGOT:1:3",
        "BREAD:1:4",
        "TORCH:4:12"
    ]
}

# The grid of each dimension, by dimension id. A dimension not named here uses the overworld's grid.
# Each block is written BLOCK:weight: a block of weight 20 stands in the grid twice as often as one of
# weight 10. spawners lists the creatures a spawner in the grid can raise.
# biome is the biome the grid stands in; empty leaves the world's own. loot names the loot table under
# loot/ a chest of the grid is filled from; empty fills it from the chest items above.
# structures lists small structures a block of the grid may be instead, each written template:chance,
# the chance from 0 to 1 that one block of the grid is it. A template is one of the server's own or a
# datapack's, or schematic:<name> for schematics/<name>.schem: the plugin writes the four shipped ones
# on its first start. A structure stands on the block's place, centred on it, and is laid only where it
# fits between that block and the next on every side, inside one chunk; elsewhere the block stays a
# block. Its chests are filled from loot and its spawners raise the palette's creatures.
palettes {
    overworld {
        blocks = [
            "DIRT:40",
            "GRASS_BLOCK:20",
            "STONE:40",
            "COBBLESTONE:10",
            "SAND:10",
            "GRAVEL:8",
            "OAK_LOG:15",
            "SPRUCE_LOG:6",
            "BIRCH_LOG:6",
            "OAK_LEAVES:6",
            "CLAY:3",
            "PUMPKIN:2",
            "MELON:2",
            "COAL_ORE:8",
            "IRON_ORE:6",
            "COPPER_ORE:4",
            "GOLD_ORE:2",
            "REDSTONE_ORE:3",
            "LAPIS_ORE:2",
            "DIAMOND_ORE:1",
            "OBSIDIAN:1",
            "WATER:3",
            "LAVA:2",
            "CHEST:2",
            "SPAWNER:1"
        ]
        spawners = ["ZOMBIE", "SKELETON", "SPIDER", "CREEPER"]
        biome = "plains"
        loot = "skygrid"
        structures = ["schematic:grid_tree:0.006", "schematic:grid_well:0.003"]
    }
    the_nether {
        blocks = [
            "NETHERRACK:60",
            "SOUL_SAND:10",
            "GLOWSTONE:6",
            "NETHER_QUARTZ_ORE:8",
            "NETHER_GOLD_ORE:5",
            "MAGMA_BLOCK:4",
            "NETHER_BRICKS:6",
            "CRIMSON_STEM:4",
            "WARPED_STEM:4",
            "NETHER_WART_BLOCK:3",
            "GRAVEL:3",
            "LAVA:3",
            "CHEST:2",
            "SPAWNER:1"
        ]
        spawners = ["BLAZE", "MAGMA_CUBE", "WITHER_SKELETON"]
        biome = "nether_wastes"
        loot = "skygrid_nether"
        structures = ["schematic:grid_fortress:0.004"]
    }
    the_end {
        blocks = ["END_STONE:70", "END_STONE_BRICKS:6", "PURPUR_BLOCK:8", "OBSIDIAN:6", "CHEST:2"]
        spawners = ["ENDERMAN"]
        biome = "the_end"
        loot = "skygrid_end"
        structures = ["schematic:grid_pillar:0.004"]
    }
}
