        set {
            difficulty = "<tag:'PARKOUR'> <body>This course is now <value><tag><body>."
            category = "<tag:'PARKOUR'> <body>This course is now in <value><tag><body>."
        }
        # Said when the course's tag is taken off.
        cleared {
            difficulty = "<tag:'PARKOUR'> <body>This course has no difficulty now."
            category = "<tag:'PARKOUR'> <body>This course has no category now."
        }
        # Said when the name is none the operator lists: <name>, and <choices>, those they do.
        unknown = "<etag:'ERROR'> <body><value><name><body> is not one of them. Choose from <value><choices><body>."
        # Said to a player who is not of the course's team, or may not change its settings.
        not_team = "<etag:'ERROR'> <body>Only the course's team can tag it."
        # Said when the tags could not be written.
        failed = "<etag:'ERROR'> <body>The course could not be tagged. Try again."
    }
    rate {
        # Said when the course is rated: <stars> of <most>.
        done = "<tag:'PARKOUR'> <body>You rated this course <value><stars><body> of <value><most><body>."
        # Said to a runner who has not finished the course.
        not_finished = "<etag:'ERROR'> <body>Finish the course before you rate it."
        # Said to the course's own team.
        own = "<etag:'ERROR'> <body>You cannot rate your own course."
        # Said when the stars are outside 1 to <most>.
        range = "<etag:'ERROR'> <body>Rate it from <value>1<body> to <value><most><body>."
        # Said when the operator turned ratings off.
        off = "<etag:'ERROR'> <body>Courses are not rated on this server."
        # Said when the rating could not be written.
        failed = "<etag:'ERROR'> <body>The rating could not be kept. Try again."
    }
    # The difficulties of modules/parkour.conf, by name. A name not here is shown as written.
    difficulties {
        easy = "Easy"
        medium = "Medium"
        hard = "Hard"
        expert = "Expert"
    }
