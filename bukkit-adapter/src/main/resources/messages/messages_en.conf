        # <season> is the season's name as the season system writes it.
        header = "<accent><season>: the best times"
        empty = "<tag:'PARKOUR'> <body>Nobody finished this course in <accent><season></accent> yet."
        none = "<tag:'PARKOUR'> <body>There is no season under way."
        unknown = "<tag:'PARKOUR'> <body>There is no season <accent><number></accent>."
        # Said when a finish leads the season under way: <time> is the run, <season> the season's name.
        record = "<tag:'PARKOUR'> <good>A season record<body>: <accent><time></accent> leads <accent><season></accent>."
    }
}
stranger {
    # The compass is drawn as a tile, as every item of ours is: a blank name, and these words in the lore.
    compass {
        title = "Warped Compass"
        crumb = "Stranger lands"
        description = "Points at whoever stands on the other side of the veil."
    }
}
poseidon {
    # Said by the lore command to a player whose island is not a Poseidon island.
    not_poseidon = "<etag:'ERROR'> <body>Your island is not a Poseidon island."
    # Said by the lore command when the language file holds no pages.
    lore_empty = "<tag:'SEA'> <body>The sea has no stories to tell yet."
    # The lore book a Poseidon island's players read. Every line of pages is one page: write as many as
    # you like. A Java player reads a book, a Bedrock player a form a page at a time.
    lore {
        title = "The Drowned Chronicle"
        author = "The Sea"
        previous = "Previous page"
        next = "Next page"
        close = "Close"
        pages = [
            "<b>The Drowned Chronicle</b>\n\nYou were born of the sea. Water is your air, and the dry world above is a desert that burns.",
            "<b>Breathe</b>\n\nIn the water you breathe and see. Out of it the air dries you, and the sun burns worse. Rain keeps you wet for a while.",
            "<b>Keep moving</b>\n\nThe sea does not love the still. Stay in one spot too long and it pulls the breath out of you. Swim, dig, build, but keep moving.",
            "<b>The wrecks</b>\n\nShips lie on the floor around you, and ruins older than them. Their chests hold what the drowned left behind.",
            "<b>The flooded depths</b>\n\nEven the Nether is drowned for your kind. Where others find fire, you will find the sea again."
        ]
        # The chapters of the story, one per story mission named in modules/poseidon.conf, each shown
        # once the reader has finished its mission. Every line is one page.
        chapters {
            poseidon_story_1 = [
                "<b>Salt and Stone</b>\n\nThe shards you handed in were not stone. They were scales, shed by something that sleeps under the floor of this sea.",
                "The old divers called it the Deep Keeper. They said it built the temples, and that it set watchers at every door."
            ]
            poseidon_story_2 = [
                "<b>The Watchers</b>\n\nThe guardians fell, and their eyes went dark. They were not beasts. They were locks, and you have opened ten of them."
            ]
            poseidon_story_3 = [
                "<b>Lanterns Below</b>\n\nWith the lanterns lit, the way down shows itself: a stair of prismarine, older than the wrecks, going where no light reached."
            ]
            poseidon_story_4 = [
                "<b>Old Nets</b>\n\nIn the nets came up a drowned journal. Its last page reads: the Elder wakes when the lanterns burn. Do not light them."
            ]
            poseidon_story_5 = [
                "<b>The Elder</b>\n\nThe Elder is gone, and the sea is quiet. The temples are yours now, and so is the deep. The story ends, and yours begins."
            ]
        }
        # The page of the first chapter not yet found. <mission> is the story mission that finds it.
        locked = "<b>A lost page</b>\n\nThe next chapter is still somewhere in the sea.\n\nFinish <mission> to find it."
    }
    # The deep boss of a Poseidon island: its name, and what the effect lists of modules/effects.conf
    # say when it rises, is slain or sinks back.
    boss {
        name = "<accent>The Deep Elder"
        rises = "<tag:'SEA'> <body>Something old rises from the deep. <accent>The Deep Elder</accent> is here."
        rises_title = "<accent>The Deep Elder"
        rises_subtitle = "<body>rises from the deep"
        slain = "<tag:'SEA'> <good>The Deep Elder is slain.<body> The sea is quiet again."
        sinks = "<tag:'SEA'> <body>The Deep Elder sinks back into the dark."
    }
}

