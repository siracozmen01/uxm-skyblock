# The OneBlock game mode. Each phase in modules/oneblock.conf is titled here by its name.
oneblock {
    # Said to the player whose break starts a new phase.
    phase_began = "<tag:'ONEBLOCK'> <body>The block turns, and <value><phase><body> begins."
    # Said by the oneblock command on an island that is not a OneBlock island.
    not_oneblock = "<etag:'ERROR'> <body>Your island is not a OneBlock island."
    # Said by the oneblock command when its menu file is missing. It may name every value the menu names.
    standing = "<tag:'ONEBLOCK'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>: <value><phase_blocks><body> of <value><phase_length><body> blocks, <value><blocks_broken><body> broken in all."
    # A OneBlock moment's line over the block, as a phase file names it with text = "@key".
    moments {
        plains_chest = "<value>A chest!<body> Open it before anyone else does."
    }
    # What a phase's requires lines ask, said to the breaker while the island waits at the end of the phase before.
    requires {
        missing = "<etag:'ONEBLOCK'> <body><value><phase><body> waits for:"
        money = " <dim>•</dim> <money><amount></money> <muted>of your money"
        money_island = " <dim>•</dim> <money><amount></money> <muted>in the island bank"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>of your own"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>in the island bank"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>island level <level><needed>"
        permission = " <dim>•</dim> <muted>the right <value><permission>"
        met = "<tag:'ONEBLOCK'> <body>Everything <value><phase><body> asks is there, and it begins."
    }
    # Said by oneblock-lucky-break of modules/effects.conf on a lucky break.
    lucky = "<tag:'ONEBLOCK'> <value>A lucky break!<body> Something good came with it."
    # A breaker's progress, on the boss bar or the action bar, and where it shows. It may name <phase>,
    # <broken> and <length>.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # The line over the block, in the server's language, while progress.line is on.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'ONEBLOCK'> <body>Your OneBlock progress now shows <value><bar><body>."
        names {
            bossbar = "on a boss bar"
            actionbar = "on the action bar"
            none = "nowhere"
        }
    }
    # Said to the breaker when a hostile creature is drawn ahead. It may name <creature> and <breaks>.
    creature_coming = "<etag:'ONEBLOCK'> <warn><creature><body> comes in <value><breaks><body> breaks."
    # The ways on from a phase that branches, said when its file is gone, and the pick.
    branch {
        offer = "<tag:'ONEBLOCK'> <value><phase><body> ends here. Without a pick, <value><first><body> is taken in <value><time><body>. The ways on:"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'ONEBLOCK'> <body>Your island goes on from <value><phase><body> to <value><way><body>."
        taken = "<tag:'ONEBLOCK'> <body>No way was picked, so your island goes on from <value><phase><body> to <value><way><body>."
    }
    # The countdown over the block of a phase that waits once it begins. It may name <phase> and <time>.
    pause_line = "<value><phase>\n<body>begins in <value><time>"
    # A line a phase file's began, finished or first-finished list names with "@key".
    lists {
        plains_first = "<tag:'ONEBLOCK'> <body>Your island has left the <value>Plains<body> behind for the first time."
    }
    phases {
        plains = "Plains"
        underground = "Underground"
        snow = "Snowfields"
        ocean = "Ocean Floor"
        jungle = "Jungle"
        nether = "The Nether"
        end = "The End"
    }
    # What each shipped phase holds, as its file's preview names it, shown in the phases menu.
    previews {
        plains = "Grass, dirt and wood to build with, farm animals, and a treasure chest at break 100."
        underground = "Stone and the first ores: coal, iron, copper and gold, with barrels of treasure."
        snow = "Snow, ice and spruce, with lapis in the cold."
        ocean = "Sand, clay and prismarine, sea lanterns and sponges, and the odd wreck chest."
        jungle = "Jungle wood, moss, melons and bamboo, with emeralds hidden in it."
        nether = "Netherrack, quartz and gold, glowstone, and now and then ancient debris."
        end = "End stone, obsidian and purpur, with diamonds at the very end."
    }
}

