parkour {
    # Said as a player steps onto a Parkour course and what they brought is kept aside.
    kept = "<tag:'PARKOUR'> <body>Your items are kept safe while you are on this course."
    # Said as a player leaves a Parkour course and has what they brought back.
    given_back = "<tag:'PARKOUR'> <body>You have your items back."
    # Said when a run starts on the start plate.
    started = "<tag:'PARKOUR'> <body>The run is <good>on<body>. Reach the finish plate."
    # Said at a checkpoint.
    checkpoint = "<tag:'PARKOUR'> <body>Checkpoint."
    # Said at a checkpoint the run reaches for the first time, when the runner's best did not: how long the run took.
    split = "<tag:'PARKOUR'> <body>Checkpoint at <value><time><body>."
    # Said at a checkpoint as fast as the runner's best there, or faster: <diff> is by how much.
    split_ahead = "<tag:'PARKOUR'> <body>Checkpoint at <value><time><body>, <good><diff><body> ahead of your best."
    # Said at a checkpoint slower than the runner's best there: <diff> is by how much.
    split_behind = "<tag:'PARKOUR'> <body>Checkpoint at <value><time><body>, <bad><diff><body> behind your best."
    # Said when a runner who fell is put back on the last checkpoint.
    returned = "<tag:'PARKOUR'> <body>Back to your last checkpoint."
    # Said at the finish when the database could not be read.
    finished = "<tag:'PARKOUR'> <body>You finished in <value><time><body>."
    # Said at a runner's first finish on the course.
    first = "<tag:'PARKOUR'> <body>You finished in <value><time><body>, your first time on this course."
    # Said when a runner beats their best.
    beaten = "<tag:'PARKOUR'> <body>A new best of <good><time><body>, down from <value><was><body>."
    # Said when a runner is slower than their best.
    slower = "<tag:'PARKOUR'> <body>You finished in <value><time><body>. Your best is <value><best><body>."
    # Said when a finish is faster than anybody has run the course, the first finish on it included.
    course_record = "<tag:'PARKOUR'> <good>A course record<body>: nobody has run it faster than <value><time><body>."
    # Said when a run takes longer than the limit.
    timed_out = "<tag:'PARKOUR'> <body>The run took too long and is <bad>over<body>."
    # Said when a runner leaves the course.
    left = "<tag:'PARKOUR'> <body>You left the course, so the run is <bad>over<body>."
    # Said when a run ends for a check it broke.
    check {
        flight = "<tag:'PARKOUR'> <body>No flying on a run. The run is <bad>over<body>."
        teleport = "<tag:'PARKOUR'> <body>You were moved off the course's path. The run is <bad>over<body>."
        speed = "<tag:'PARKOUR'> <body>That was faster than anybody runs. The run is <bad>over<body>."
    }
    # Said as a run starts against a ghost: an item only the runner sees retraces a run of <time>.
    ghost = "<tag:'PARKOUR'> <body>A ghost runs beside you, finishing in <value><time><body>. Beat it."
    # Said by the course command off a Parkour course.
    not_course = "<etag:'ERROR'> <body>You are not on a Parkour course."
    # The course command's heading.
    top_header = "<h:'Best times here'>"
    # One runner on the course command, fastest first.
    top_entry = " <muted>#<place></muted> <body><player></body> <value><time></value> <muted>(<runs> runs)"
    # Said by the course command when nobody has finished the course.
    top_empty = "<tag:'PARKOUR'> <body>Nobody has finished this course yet."
    # The course board's line of tags: <difficulty> and <category>, each a word below or the name as written.
    about_tags = "<muted>Difficulty</muted> <value><difficulty></value> <muted>Category</muted> <value><category></value>"
    # The course board's rating: <rating> stars of <most> on average, from <count> runners.
    about_rating = "<muted>Rated</muted> <value><rating></value><muted>/<most> by <count> runners</muted>"
    # The course board when no runner has rated the course.
    about_unrated = "<muted>Not rated yet.</muted>"
    tag {
        # Said for a tag the course was not given.
        none = "none"
