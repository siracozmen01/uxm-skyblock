# OneBlock oyun modu. modules/oneblock.conf içindeki her aşama burada adıyla başlıklandırılır.
oneblock {
    # Yeni bir aşamayı başlatan kırmayı yapan oyuncuya söylenir.
    phase_began = "<tag:'Tek Blok'> <body>Blok değişiyor, <value><phase><body> başladı."
    # Tek Blok adası olmayan bir adada oneblock komutu yazılınca söylenir.
    not_oneblock = "<etag:'Hata'> <body>Adan bir Tek Blok adası değil."
    # Menü dosyası yokken oneblock komutu bunu söyler. Menünün adlandırdığı her değeri kullanabilir.
    standing = "<tag:'Tek Blok'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>: <value><phase_length><body> bloktan <value><phase_blocks><body> tanesi, toplam <value><blocks_broken><body> blok kırıldı."
    # Bir evre dosyasının text = "@anahtar" ile adlandırdığı, bloğun üstündeki an satırı.
    moments {
        plains_chest = "<value>Bir sandık!<body> Başkası açmadan aç."
    }
    # Bir evrenin requires satırlarının istedikleri; ada önceki evrenin sonunda beklerken kırana söylenir.
    requires {
        missing = "<etag:'Tek Blok'> <value><phase><body> şunları bekliyor:"
        money = " <dim>•</dim> <money><amount></money> <muted>kendi paranla"
        money_island = " <dim>•</dim> <money><amount></money> <muted>ada bankasında"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>kendinde"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>ada bankasında"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>ada seviyesi <level><needed>"
        permission = " <dim>•</dim> <muted><value><permission><muted> yetkisi"
        met = "<tag:'Tek Blok'> <body><value><phase><body> için istenen her şey tamam, evre başlıyor."
    }
    # Kıranın ilerlemesi, boss bar ya da aksiyon çubuğunda, ve nerede gösterildiği. <phase>, <broken> ve
    # <length> kullanabilir.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # Bloğun üstündeki satır, sunucunun dilinde, progress.line açıkken.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'Tek Blok'> <body>Tek Blok ilerlemen artık <value><bar><body> gösteriliyor."
        names {
            bossbar = "boss barda"
            actionbar = "aksiyon çubuğunda"
            none = "hiçbir yerde"
        }
    }
    # Önceden düşman bir yaratık çekildiğinde kırana söylenir. <creature> ve <breaks> kullanabilir.
    creature_coming = "<etag:'Tek Blok'> <warn><creature><body>, <value><breaks><body> kırma sonra geliyor."
    # Dallanan bir evreden sonraki yollar, dosyası yokken söylenir, ve seçim.
    branch {
        offer = "<tag:'Tek Blok'> <value><phase><body> burada bitiyor. Seçmezsen <value><time><body> sonra <value><first><body> alınır. Yollar:"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'Tek Blok'> <body>Adan <value><phase><body> evresinden sonra <value><way><body> yoluna gidiyor."
        taken = "<tag:'Tek Blok'> <body>Yol seçilmedi, adan <value><phase><body> evresinden sonra <value><way><body> yoluna gidiyor."
    }
    # Başladığında bekleyen bir evrenin bloğu üstündeki geri sayım. <phase> ve <time> kullanabilir.
    pause_line = "<value><phase>\n<value><time><body> sonra başlıyor"
    # Bir evre dosyasının began, finished ya da first-finished listesinin "@anahtar" ile adlandırdığı satır.
    lists {
        plains_first = "<tag:'Tek Blok'> <body>Adan <value>Ovalar<body> evresini ilk kez geride bıraktı."
    }
    phases {
        plains = "Ovalar"
        underground = "Yeraltı"
        snow = "Karlı Topraklar"
        ocean = "Okyanus Tabanı"
        jungle = "Orman"
        nether = "Nether"
        end = "End"
    }
    # Gelen her evrenin içinde olan, dosyasının preview satırının adlandırdığı gibi, evreler menüsünde gösterilir.
    previews {
        plains = "Yapı için çimen, toprak ve odun, çiftlik hayvanları, 100. kırılışta bir hazine sandığı."
        underground = "Taş ve ilk madenler: kömür, demir, bakır ve altın, hazine dolu variller."
        snow = "Kar, buz ve ladin, soğukta lapis."
        ocean = "Kum, kil ve prizmarin, deniz fenerleri ve süngerler, arada bir batık sandığı."
        jungle = "Orman odunu, yosun, karpuz ve bambu, içinde saklı zümrütler."
        nether = "Netherrack, kuvars ve altın, ışıktaşı, arada bir kadim kalıntı."
        end = "End taşı, obsidyen ve purpur, en sonda elmas."
    }
}

