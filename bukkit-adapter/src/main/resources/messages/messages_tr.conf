# Türkçe mesajlar.
#
# Her satır MiniMessage'dır ve renk yerine bir görev adı yazar: <body> metindir, <value> bir isim
# ya da sayıdır, <money> bir para tutarıdır, <good> ve <bad> bir durumdur, <tag:'Ada'> ise sohbet
# satırının başındaki önektir. Bu adların arkasındaki renkler theme.conf dosyasındadır, bu dosya
# hiçbir renk tutmaz.
#
# Türkçe küçük büyük harfe çevrilmez, harfler yazdığın gibi görünür.
#
# Sildiğin bir anahtar eklentideki satıra döner, bu yüzden oyuncu hiçbir zaman boş satır okumaz.

