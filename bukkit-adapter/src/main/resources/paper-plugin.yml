name: uxmSkyblock
version: '${version}'
main: com.uxplima.uxmskyblock.bukkit.bootstrap.UxMSkyblockPlugin
api-version: '26.2'
folia-supported: true
# Before the worlds, so the default world can be given the island generator.
load: STARTUP
description: Enterprise-grade, distributed, event-driven Skyblock platform
author: UXPLIMA
dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
    # The economies a bank currency may live in, so each is up before the bank asks it.
    Treasury:
      load: BEFORE
      required: false
    PlayerPoints:
      load: BEFORE
      required: false
    EcoBits:
      load: BEFORE
      required: false
    mcMMO:
      load: BEFORE
      required: false
    floodgate:
      load: BEFORE
      required: false
    Geyser-Spigot:
      load: BEFORE
      required: false
    dynmap:
      load: BEFORE
      required: false
    BlueMap:
      load: BEFORE
      required: false
    Pl3xMap:
      load: BEFORE
      required: false

