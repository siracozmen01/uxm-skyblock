name: uxmSkyblock
version: '${version}'
main: com.uxplima.uxmskyblock.bukkit.bootstrap.UxMSkyblockPlugin
# Hands the server the data pack of the sulfur sea biome before the worlds load.
bootstrapper: com.uxplima.uxmskyblock.bukkit.bootstrap.UxMSkyblockBootstrap
api-version: '26.2'
folia-supported: true
# Before the worlds, so the default world can be given the island generator.
load: STARTUP
description: Enterprise-grade, distributed, event-driven Skyblock platform
author: UXPLIMA
dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
    # The economies a bank currency may live in, so each is up before the bank asks it.
    Treasury:
      load: BEFORE
      required: false
    PlayerPoints:
      load: BEFORE
      required: false
    EcoBits:
      load: BEFORE
      required: false
    mcMMO:
      load: BEFORE
      required: false
    floodgate:
      load: BEFORE
      required: false
    Geyser-Spigot:
      load: BEFORE
      required: false
    dynmap:
      load: BEFORE
      required: false
    BlueMap:
      load: BEFORE
      required: false
    Pl3xMap:
      load: BEFORE
      required: false
    # Blocks and creatures a OneBlock phase may name with the plugin's word in front, read when it is there.
    ItemsAdder:
      load: BEFORE
      required: false
    Nexo:
      load: BEFORE
      required: false
    CraftEngine:
      load: BEFORE
      required: false
    MythicMobs:
      load: BEFORE
      required: false

