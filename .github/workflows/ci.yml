name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Spotless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Compile with -Werror and ErrorProne
        run: ./gradlew compileJava compileTestJava

  test-matrix:
    name: Test Matrix (${{ matrix.database }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlite, mysql, postgresql ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests (SQLite)
        if: matrix.database == 'sqlite'
        run: ./gradlew check :bukkit-adapter:redisIntegrationTest --no-build-cache

      - name: Run Tests & Database Integration (MySQL / MariaDB)
        if: matrix.database == 'mysql'
        run: ./gradlew check :persistence-adapter:mariadbIntegrationTest :persistence-adapter:mysqlIntegrationTest --no-build-cache

      - name: Run Tests & Database Integration (PostgreSQL)
        if: matrix.database == 'postgresql'
        run: ./gradlew check :persistence-adapter:postgresIntegrationTest --no-build-cache

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
